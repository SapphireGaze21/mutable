description: TPC-DS Query 30
suite: TPC
benchmark: TPC-DS
name: Q30
readonly: true
data:
    Customer:
        file: benchmark/tpcds/data/customer.csv
        lines_in_file: 100001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'c_customer_sk': 'INT NOT NULL'
            'c_customer_id': 'CHAR 16 NOT NULL'
            'c_current_cdemo_sk': 'INT'
            'c_current_hdemo_sk': 'INT'
            'c_current_addr_sk': 'INT'
            'c_first_shipto_date_sk': 'INT'
            'c_first_sales_date_sk': 'INT'
            'c_salutation': 'CHAR 10'
            'c_first_name': 'CHAR 20'
            'c_last_name': 'CHAR 30'
            'c_preferred_cust_flag': 'CHAR 1'
            'c_birth_day': 'INT'
            'c_birth_month': 'INT'
            'c_birth_year': 'INT'
            'c_birth_country': 'CHAR 20'
            'c_login': 'CHAR 13'
            'c_email_address': 'CHAR 50'
            'c_last_review_date_sk': 'INT'
    CustomerAddress:
        file: benchmark/tpcds/data/customer_address.csv
        lines_in_file: 50001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ca_address_sk': 'INT NOT NULL'
            'ca_address_id': 'CHAR 16 NOT NULL'
            'ca_street_number': 'CHAR 10'
            'ca_street_name': 'CHAR 60'
            'ca_street_type': 'CHAR 15'
            'ca_suite_number': 'CHAR 10'
            'ca_city': 'CHAR 60'
            'ca_county': 'CHAR 30'
            'ca_state': 'CHAR 2'
            'ca_zip': 'CHAR 10'
            'ca_country': 'CHAR 20'
            'ca_gmt_offset': 'DECIMAL 5 2'
            'ca_location_type': 'CHAR 20'
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    WebReturns:
        file: benchmark/tpcds/data/web_returns.csv
        lines_in_file: 71655
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'wr_returned_date_sk': 'INT'
            'wr_returned_time_sk': 'INT'
            'wr_item_sk': 'INT NOT NULL'
            'wr_refunded_customer_sk': 'INT'
            'wr_refunded_cdemo_sk': 'INT'
            'wr_refunded_hdemo_sk': 'INT'
            'wr_refunded_addr_sk': 'INT'
            'wr_returning_customer_sk': 'INT'
            'wr_returning_cdemo_sk': 'INT'
            'wr_returning_hdemo_sk': 'INT'
            'wr_returning_addr_sk': 'INT'
            'wr_web_page_sk': 'INT'
            'wr_reason_sk': 'INT'
            'wr_order_number': 'INT NOT NULL'
            'wr_return_quantity': 'INT'
            'wr_return_amt': 'DECIMAL 7 2'
            'wr_return_tax': 'DECIMAL 7 2'
            'wr_return_amt_inc_tax': 'DECIMAL 7 2'
            'wr_fee': 'DECIMAL 7 2'
            'wr_return_ship_cost': 'DECIMAL 7 2'
            'wr_refunded_cash': 'DECIMAL 7 2'
            'wr_reversed_charge': 'DECIMAL 7 2'
            'wr_account_credit': 'DECIMAL 7 2'
            'wr_net_loss': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH customer_total_return AS
                  (SELECT wr_returning_customer_sk AS ctr_customer_sk,
                          ca_state AS ctr_state,
                          sum(wr_return_amt) AS ctr_total_return
                   FROM web_returns,
                        date_dim,
                        customer_address
                   WHERE wr_returned_date_sk = d_date_sk
                     AND d_year = 2002
                     AND wr_returning_addr_sk = ca_address_sk
                   GROUP BY wr_returning_customer_sk,
                            ca_state)
                SELECT c_customer_id,
                       c_salutation,
                       c_first_name,
                       c_last_name,
                       c_preferred_cust_flag,
                       c_birth_day,
                       c_birth_month,
                       c_birth_year,
                       c_birth_country,
                       c_login,
                       c_email_address,
                       c_last_review_date_sk,
                       ctr_total_return
                FROM customer_total_return ctr1,
                     customer_address,
                     customer
                WHERE ctr1.ctr_total_return >
                    (SELECT avg(ctr_total_return)*1.2
                     FROM customer_total_return ctr2
                     WHERE ctr1.ctr_state = ctr2.ctr_state)
                  AND ca_address_sk = c_current_addr_sk
                  AND ca_state = 'GA'
                  AND ctr1.ctr_customer_sk = c_customer_sk
                ORDER BY c_customer_id,
                         c_salutation,
                         c_first_name,
                         c_last_name,
                         c_preferred_cust_flag,
                         c_birth_day,
                         c_birth_month,
                         c_birth_year,
                         c_birth_country,
                         c_login,
                         c_email_address,
                         c_last_review_date_sk,
                         ctr_total_return
                LIMIT 100;
                
