            'ws_list_price': 'DECIMAL 7 2'
            'ws_sales_price': 'DECIMAL 7 2'
            'ws_ext_discount_amt': 'DECIMAL 7 2'
            'ws_ext_sales_price': 'DECIMAL 7 2'
            'ws_ext_wholesale_cost': 'DECIMAL 7 2'
            'ws_ext_list_price': 'DECIMAL 7 2'
            'ws_ext_tax': 'DECIMAL 7 2'
            'ws_coupon_amt': 'DECIMAL 7 2'
            'ws_ext_ship_cost': 'DECIMAL 7 2'
            'ws_net_paid': 'DECIMAL 7 2'
            'ws_net_paid_inc_tax': 'DECIMAL 7 2'
            'ws_net_paid_inc_ship': 'DECIMAL 7 2'
            'ws_net_paid_inc_ship_tax': 'DECIMAL 7 2'
            'ws_net_profit': 'DECIMAL 7 2'
    WebSite:
        file: benchmark/tpcds/data/web_site.csv
        lines_in_file: 31
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'web_site_sk': 'INT NOT NULL'
            'web_site_id': 'CHAR 16 NOT NULL'
            'web_rec_start_date': 'DATE'
            'web_rec_end_date': 'DATE'
            'web_name': 'CHAR 50'
            'web_open_date_sk': 'INT'
            'web_close_date_sk': 'INT'
            'web_class': 'CHAR 50'
            'web_manager': 'CHAR 40'
            'web_mkt_id': 'INT'
            'web_mkt_class': 'CHAR 50'
            'web_mkt_desc': 'CHAR 100'
            'web_market_manager': 'CHAR 40'
            'web_company_id': 'INT'
            'web_company_name': 'CHAR 50'
            'web_street_number': 'CHAR 10'
            'web_street_name': 'CHAR 60'
            'web_street_type': 'CHAR 15'
            'web_suite_number': 'CHAR 10'
            'web_city': 'CHAR 60'
            'web_county': 'CHAR 30'
            'web_state': 'CHAR 2'
            'web_zip': 'CHAR 10'
            'web_country': 'CHAR 20'
            'web_gmt_offset': 'DECIMAL 5 2'
            'web_tax_percentage': 'DECIMAL 5 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT w_substr,
                       sm_type,
                       web_name,
                       sum(CASE
                               WHEN (ws_ship_date_sk - ws_sold_date_sk <= 30) THEN 1
                               ELSE 0
                           END) AS 30 days,
                       sum(CASE
                               WHEN (ws_ship_date_sk - ws_sold_date_sk > 30)
                                    AND (ws_ship_date_sk - ws_sold_date_sk <= 60) THEN 1
                               ELSE 0
                           END) AS 31-60 days,
                       sum(CASE
                               WHEN (ws_ship_date_sk - ws_sold_date_sk > 60)
                                    AND (ws_ship_date_sk - ws_sold_date_sk <= 90) THEN 1
                               ELSE 0
                           END) AS 61-90 days,
                       sum(CASE
                               WHEN (ws_ship_date_sk - ws_sold_date_sk > 90)
                                    AND (ws_ship_date_sk - ws_sold_date_sk <= 120) THEN 1
                               ELSE 0
                           END) AS 91-120 days,
                       sum(CASE
                               WHEN (ws_ship_date_sk - ws_sold_date_sk > 120) THEN 1
                               ELSE 0
                           END) AS >120 days
                FROM web_sales,
                  (SELECT SUBSTRING(w_warehouse_name,1,20) w_substr,
                          *
                   FROM warehouse) sq1,
                     ship_mode,
                     web_site,
                     date_dim
                WHERE d_month_seq BETWEEN 1200 AND 1200 + 11
                  AND ws_ship_date_sk = d_date_sk
                  AND ws_warehouse_sk = w_warehouse_sk
                  AND ws_ship_mode_sk = sm_ship_mode_sk
                  AND ws_web_site_sk = web_site_sk
                GROUP BY w_substr,
                         sm_type,
                         web_name
                ORDER BY 1,
                         2,
                         3
                LIMIT 100;
                
