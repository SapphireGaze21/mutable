description: TPC-DS Query 70
suite: TPC
benchmark: TPC-DS
name: Q70
readonly: true
data:
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    Store:
        file: benchmark/tpcds/data/store.csv
        lines_in_file: 13
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            's_store_sk': 'INT NOT NULL'
            's_store_id': 'CHAR 16 NOT NULL'
            's_rec_start_date': 'DATE'
            's_rec_end_date': 'DATE'
            's_closed_date_sk': 'INT'
            's_store_name': 'CHAR 50'
            's_number_employees': 'INT'
            's_floor_space': 'INT'
            's_hours': 'CHAR 20'
            's_manager': 'CHAR 40'
            's_market_id': 'INT'
            's_geography_class': 'CHAR 100'
            's_market_desc': 'CHAR 100'
            's_market_manager': 'CHAR 40'
            's_division_id': 'INT'
            's_division_name': 'CHAR 50'
            's_company_id': 'INT'
            's_company_name': 'CHAR 50'
            's_street_number': 'CHAR 10'
            's_street_name': 'CHAR 60'
            's_street_type': 'CHAR 15'
            's_suite_number': 'CHAR 10'
            's_city': 'CHAR 60'
            's_county': 'CHAR 30'
            's_state': 'CHAR 2'
            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH results AS
                  (SELECT sum(ss_net_profit) AS total_sum,
                          s_state,
                          s_county,
                          0 AS gstate,
                          0 AS g_county
                   FROM store_sales ,
                        date_dim d1 ,
                        store
                   WHERE d1.d_month_seq BETWEEN 1200 AND 1200 + 11
                     AND d1.d_date_sk = ss_sold_date_sk
                     AND s_store_sk = ss_store_sk
                     AND s_state IN
                       (SELECT s_state
                        FROM
                          (SELECT s_state AS s_state,
                                  rank() OVER (PARTITION BY s_state
                                               ORDER BY sum(ss_net_profit) DESC) AS ranking
                           FROM store_sales,
                                store,
                                date_dim
                           WHERE d_month_seq BETWEEN 1200 AND 1200 + 11
                             AND d_date_sk = ss_sold_date_sk
                             AND s_store_sk = ss_store_sk
                           GROUP BY s_state ) tmp1
                        WHERE ranking <= 5)
                   GROUP BY s_state,
                            s_county),
                     results_rollup AS
                  (SELECT total_sum,
                          s_state,
                          s_county,
                          0 AS g_state,
                          0 AS g_county,
                          0 AS lochierarchy
                   FROM results
                   UNION SELECT sum(total_sum) AS total_sum,
                                s_state,
                                NULL AS s_county,
                                0 AS g_state,
                                1 AS g_county,
                                1 AS lochierarchy
                   FROM results
                   GROUP BY s_state
                   UNION SELECT sum(total_sum) AS total_sum,
                                NULL AS s_state,
                                NULL AS s_county,
                                1 AS g_state,
                                1 AS g_county,
                                2 AS lochierarchy
                   FROM results)
                SELECT total_sum,
                       s_state,
                       s_county,
                       lochierarchy,
                       rank() OVER ( PARTITION BY lochierarchy,
                                                  CASE
                                                      WHEN g_county = 0 THEN s_state
                                                  END
                                    ORDER BY total_sum DESC) AS rank_within_parent
                FROM results_rollup
                ORDER BY lochierarchy DESC ,
                         CASE
                             WHEN lochierarchy = 0 THEN s_state
                         END ,
                         rank_within_parent
                LIMIT 100;
                
