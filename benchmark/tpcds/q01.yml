description: TPC-DS Query 01
suite: TPC
benchmark: TPC-DS
name: Q01
readonly: true
data:
    Customer:
        file: benchmark/tpcds/data/customer.csv
        lines_in_file: 100001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'c_customer_sk': 'INT NOT NULL'
            'c_customer_id': 'CHAR 16 NOT NULL'
            'c_current_cdemo_sk': 'INT'
            'c_current_hdemo_sk': 'INT'
            'c_current_addr_sk': 'INT'
            'c_first_shipto_date_sk': 'INT'
            'c_first_sales_date_sk': 'INT'
            'c_salutation': 'CHAR 10'
            'c_first_name': 'CHAR 20'
            'c_last_name': 'CHAR 30'
            'c_preferred_cust_flag': 'CHAR 1'
            'c_birth_day': 'INT'
            'c_birth_month': 'INT'
            'c_birth_year': 'INT'
            'c_birth_country': 'CHAR 20'
            'c_login': 'CHAR 13'
            'c_email_address': 'CHAR 50'
            'c_last_review_date_sk': 'INT'
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    Store:
        file: benchmark/tpcds/data/store.csv
        lines_in_file: 13
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            's_store_sk': 'INT NOT NULL'
            's_store_id': 'CHAR 16 NOT NULL'
            's_rec_start_date': 'DATE'
            's_rec_end_date': 'DATE'
            's_closed_date_sk': 'INT'
            's_store_name': 'CHAR 50'
            's_number_employees': 'INT'
            's_floor_space': 'INT'
            's_hours': 'CHAR 20'
            's_manager': 'CHAR 40'
            's_market_id': 'INT'
            's_geography_class': 'CHAR 100'
            's_market_desc': 'CHAR 100'
            's_market_manager': 'CHAR 40'
            's_division_id': 'INT'
            's_division_name': 'CHAR 50'
            's_company_id': 'INT'
            's_company_name': 'CHAR 50'
            's_street_number': 'CHAR 10'
            's_street_name': 'CHAR 60'
            's_street_type': 'CHAR 15'
            's_suite_number': 'CHAR 10'
            's_city': 'CHAR 60'
            's_county': 'CHAR 30'
            's_state': 'CHAR 2'
            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreReturns:
        file: benchmark/tpcds/data/store_returns.csv
        lines_in_file: 287868
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'sr_returned_date_sk': 'INT'
            'sr_return_time_sk': 'INT'
            'sr_item_sk': 'INT NOT NULL'
            'sr_customer_sk': 'INT'
            'sr_cdemo_sk': 'INT'
            'sr_hdemo_sk': 'INT'
            'sr_addr_sk': 'INT'
            'sr_store_sk': 'INT'
            'sr_reason_sk': 'INT'
            'sr_ticket_number': 'INT NOT NULL'
            'sr_return_quantity': 'INT'
            'sr_return_amt': 'DECIMAL 7 2'
            'sr_return_tax': 'DECIMAL 7 2'
            'sr_return_amt_inc_tax': 'DECIMAL 7 2'
            'sr_fee': 'DECIMAL 7 2'
            'sr_return_ship_cost': 'DECIMAL 7 2'
            'sr_refunded_cash': 'DECIMAL 7 2'
            'sr_reversed_charge': 'DECIMAL 7 2'
            'sr_store_credit': 'DECIMAL 7 2'
            'sr_net_loss': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT c_customer_id
                FROM (SELECT sr_customer_sk AS ctr_customer_sk,
                             sr_store_sk AS ctr_store_sk,
                             SUM(sr_return_amt) AS ctr_total_return
                      FROM StoreReturns,
                           DateDim
                      WHERE sr_returned_date_sk = d_date_sk
                        AND d_year = 2000
                      GROUP BY sr_customer_sk,
                               sr_store_sk) ctr1,
                     Store,
                     Customer
                WHERE ctr1.ctr_total_return >
                    (SELECT AVG(ctr_total_return)
                     FROM (SELECT sr_customer_sk AS ctr_customer_sk,
                                  sr_store_sk AS ctr_store_sk,
                                  SUM(sr_return_amt) AS ctr_total_return
                           FROM StoreReturns,
                                DateDim
                           WHERE sr_returned_date_sk = d_date_sk
                             AND d_year = 2000
                           GROUP BY sr_customer_sk,
                                    sr_store_sk) ctr2
                     WHERE ctr1.ctr_store_sk = ctr2.ctr_store_sk) * 1.2
                  AND s_store_sk = ctr1.ctr_store_sk
                  AND s_state = "TN"
                  AND ctr1.ctr_customer_sk = c_customer_sk
                ORDER BY c_customer_id
                LIMIT 100;
                
    PostgreSQL:
        cases:
            1: |
                WITH customer_total_return AS
                  (SELECT sr_customer_sk AS ctr_customer_sk,
                          sr_store_sk AS ctr_store_sk,
                          sum(sr_return_amt) AS ctr_total_return
                   FROM store_returns,
                        date_dim
                   WHERE sr_returned_date_sk = d_date_sk
                     AND d_year = 2000
                   GROUP BY sr_customer_sk,
                            sr_store_sk)
                SELECT c_customer_id
                FROM customer_total_return ctr1,
                     store,
                     customer
                WHERE ctr1.ctr_total_return >
                    (SELECT avg(ctr_total_return)*1.2
                     FROM customer_total_return ctr2
                     WHERE ctr1.ctr_store_sk = ctr2.ctr_store_sk)
                  AND s_store_sk = ctr1.ctr_store_sk
                  AND s_state = 'TN'
                  AND ctr1.ctr_customer_sk = c_customer_sk
                ORDER BY c_customer_id
                LIMIT 100;
                
    DuckDB:
        cases:
            1: |
                WITH customer_total_return AS
                  (SELECT sr_customer_sk AS ctr_customer_sk,
                          sr_store_sk AS ctr_store_sk,
                          sum(sr_return_amt) AS ctr_total_return
                   FROM store_returns,
                        date_dim
                   WHERE sr_returned_date_sk = d_date_sk
                     AND d_year = 2000
                   GROUP BY sr_customer_sk,
                            sr_store_sk)
                SELECT c_customer_id
                FROM customer_total_return ctr1,
                     store,
                     customer
                WHERE ctr1.ctr_total_return >
                    (SELECT avg(ctr_total_return)*1.2
                     FROM customer_total_return ctr2
                     WHERE ctr1.ctr_store_sk = ctr2.ctr_store_sk)
                  AND s_store_sk = ctr1.ctr_store_sk
                  AND s_state = 'TN'
                  AND ctr1.ctr_customer_sk = c_customer_sk
                ORDER BY c_customer_id
                LIMIT 100;
                
    HyPer:
        cases:
            1: |
                WITH customer_total_return AS
                  (SELECT sr_customer_sk AS ctr_customer_sk,
                          sr_store_sk AS ctr_store_sk,
                          sum(sr_return_amt) AS ctr_total_return
                   FROM store_returns,
                        date_dim
                   WHERE sr_returned_date_sk = d_date_sk
                     AND d_year = 2000
                   GROUP BY sr_customer_sk,
                            sr_store_sk)
                SELECT c_customer_id
                FROM customer_total_return ctr1,
                     store,
                     customer
                WHERE ctr1.ctr_total_return >
                    (SELECT avg(ctr_total_return)*1.2
                     FROM customer_total_return ctr2
                     WHERE ctr1.ctr_store_sk = ctr2.ctr_store_sk)
                  AND s_store_sk = ctr1.ctr_store_sk
                  AND s_state = 'TN'
                  AND ctr1.ctr_customer_sk = c_customer_sk
                ORDER BY c_customer_id
                LIMIT 100;
                
