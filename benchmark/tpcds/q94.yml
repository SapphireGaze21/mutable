            'ws_net_profit': 'DECIMAL 7 2'
    WebSite:
        file: benchmark/tpcds/data/web_site.csv
        lines_in_file: 31
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'web_site_sk': 'INT NOT NULL'
            'web_site_id': 'CHAR 16 NOT NULL'
            'web_rec_start_date': 'DATE'
            'web_rec_end_date': 'DATE'
            'web_name': 'CHAR 50'
            'web_open_date_sk': 'INT'
            'web_close_date_sk': 'INT'
            'web_class': 'CHAR 50'
            'web_manager': 'CHAR 40'
            'web_mkt_id': 'INT'
            'web_mkt_class': 'CHAR 50'
            'web_mkt_desc': 'CHAR 100'
            'web_market_manager': 'CHAR 40'
            'web_company_id': 'INT'
            'web_company_name': 'CHAR 50'
            'web_street_number': 'CHAR 10'
            'web_street_name': 'CHAR 60'
            'web_street_type': 'CHAR 15'
            'web_suite_number': 'CHAR 10'
            'web_city': 'CHAR 60'
            'web_county': 'CHAR 30'
            'web_state': 'CHAR 2'
            'web_zip': 'CHAR 10'
            'web_country': 'CHAR 20'
            'web_gmt_offset': 'DECIMAL 5 2'
            'web_tax_percentage': 'DECIMAL 5 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                
                SELECT count(DISTINCT ws_order_number) AS order count ,
                       sum(ws_ext_ship_cost) AS total shipping cost ,
                       sum(ws_net_profit) AS total net profit
                FROM web_sales ws1 ,
                     date_dim ,
                     customer_address ,
                     web_site
                WHERE d_date BETWEEN '1999-02-01' AND cast('1999-04-02' AS date)
                  AND ws1.ws_ship_date_sk = d_date_sk
                  AND ws1.ws_ship_addr_sk = ca_address_sk
                  AND ca_state = 'IL'
                  AND ws1.ws_web_site_sk = web_site_sk
                  AND web_company_name = 'pri'
                  AND EXISTS
                    (SELECT *
                     FROM web_sales ws2
                     WHERE ws1.ws_order_number = ws2.ws_order_number
                       AND ws1.ws_warehouse_sk <> ws2.ws_warehouse_sk)
                  AND NOT exists
                    (SELECT *
                     FROM web_returns wr1
                     WHERE ws1.ws_order_number = wr1.wr_order_number)
                ORDER BY count(DISTINCT ws_order_number)
                LIMIT 100;
                
