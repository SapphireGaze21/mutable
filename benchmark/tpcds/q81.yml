description: TPC-DS Query 81
suite: TPC
benchmark: TPC-DS
name: Q81
readonly: true
data:
    CatalogReturns:
        file: benchmark/tpcds/data/catalog_returns.csv
        lines_in_file: 144068
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'cr_returned_date_sk': 'INT'
            'cr_returned_time_sk': 'INT'
            'cr_item_sk': 'INT NOT NULL'
            'cr_refunded_customer_sk': 'INT'
            'cr_refunded_cdemo_sk': 'INT'
            'cr_refunded_hdemo_sk': 'INT'
            'cr_refunded_addr_sk': 'INT'
            'cr_returning_customer_sk': 'INT'
            'cr_returning_cdemo_sk': 'INT'
            'cr_returning_hdemo_sk': 'INT'
            'cr_returning_addr_sk': 'INT'
            'cr_call_center_sk': 'INT'
            'cr_catalog_page_sk': 'INT'
            'cr_ship_mode_sk': 'INT'
            'cr_warehouse_sk': 'INT'
            'cr_reason_sk': 'INT'
            'cr_order_number': 'INT NOT NULL'
            'cr_return_quantity': 'INT'
            'cr_return_amount': 'DECIMAL 7 2'
            'cr_return_tax': 'DECIMAL 7 2'
            'cr_return_amt_inc_tax': 'DECIMAL 7 2'
            'cr_fee': 'DECIMAL 7 2'
            'cr_return_ship_cost': 'DECIMAL 7 2'
            'cr_refunded_cash': 'DECIMAL 7 2'
            'cr_reversed_charge': 'DECIMAL 7 2'
            'cr_store_credit': 'DECIMAL 7 2'
            'cr_net_loss': 'DECIMAL 7 2'
    Customer:
        file: benchmark/tpcds/data/customer.csv
        lines_in_file: 100001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'c_customer_sk': 'INT NOT NULL'
            'c_customer_id': 'CHAR 16 NOT NULL'
            'c_current_cdemo_sk': 'INT'
            'c_current_hdemo_sk': 'INT'
            'c_current_addr_sk': 'INT'
            'c_first_shipto_date_sk': 'INT'
            'c_first_sales_date_sk': 'INT'
            'c_salutation': 'CHAR 10'
            'c_first_name': 'CHAR 20'
            'c_last_name': 'CHAR 30'
            'c_preferred_cust_flag': 'CHAR 1'
            'c_birth_day': 'INT'
            'c_birth_month': 'INT'
            'c_birth_year': 'INT'
            'c_birth_country': 'CHAR 20'
            'c_login': 'CHAR 13'
            'c_email_address': 'CHAR 50'
            'c_last_review_date_sk': 'INT'
    CustomerAddress:
        file: benchmark/tpcds/data/customer_address.csv
        lines_in_file: 50001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ca_address_sk': 'INT NOT NULL'
            'ca_address_id': 'CHAR 16 NOT NULL'
            'ca_street_number': 'CHAR 10'
            'ca_street_name': 'CHAR 60'
            'ca_street_type': 'CHAR 15'
            'ca_suite_number': 'CHAR 10'
            'ca_city': 'CHAR 60'
            'ca_county': 'CHAR 30'
            'ca_state': 'CHAR 2'
            'ca_zip': 'CHAR 10'
            'ca_country': 'CHAR 20'
            'ca_gmt_offset': 'DECIMAL 5 2'
            'ca_location_type': 'CHAR 20'
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH customer_total_return AS
                  (SELECT cr_returning_customer_sk AS ctr_customer_sk ,
                          ca_state AS ctr_state,
                          sum(cr_return_amt_inc_tax) AS ctr_total_return
                   FROM catalog_returns ,
                        date_dim ,
                        customer_address
                   WHERE cr_returned_date_sk = d_date_sk
                     AND d_year = 2000
                     AND cr_returning_addr_sk = ca_address_sk
                   GROUP BY cr_returning_customer_sk ,
                            ca_state)
                SELECT c_customer_id,
                       c_salutation,
                       c_first_name,
                       c_last_name,
                       ca_street_number,
                       ca_street_name ,
                       ca_street_type,
                       ca_suite_number,
                       ca_city,
                       ca_county,
                       ca_state,
                       ca_zip,
                       ca_country,
                       ca_gmt_offset ,
                       ca_location_type,
                       ctr_total_return
                FROM customer_total_return ctr1 ,
                     customer_address ,
                     customer
                WHERE ctr1.ctr_total_return >
                    (SELECT avg(ctr_total_return)*1.2
                     FROM customer_total_return ctr2
                     WHERE ctr1.ctr_state = ctr2.ctr_state)
                  AND ca_address_sk = c_current_addr_sk
                  AND ca_state = 'GA'
                  AND ctr1.ctr_customer_sk = c_customer_sk
                ORDER BY c_customer_id,
                         c_salutation,
                         c_first_name,
                         c_last_name,
                         ca_street_number,
                         ca_street_name ,
                         ca_street_type,
                         ca_suite_number,
                         ca_city,
                         ca_county,
                         ca_state,
                         ca_zip,
                         ca_country,
                         ca_gmt_offset ,
                         ca_location_type,
                         ctr_total_return
                LIMIT 100;
                
