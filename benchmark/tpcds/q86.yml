description: TPC-DS Query 86
suite: TPC
benchmark: TPC-DS
name: Q86
readonly: true
data:
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    Item:
        file: benchmark/tpcds/data/item.csv
        lines_in_file: 18001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'i_item_sk': 'INT NOT NULL'
            'i_item_id': 'CHAR 16 NOT NULL'
            'i_rec_start_date': 'DATE'
            'i_rec_end_date': 'DATE'
            'i_item_desc': 'CHAR 200'
            'i_current_price': 'DECIMAL 7 2'
            'i_wholesale_cost': 'DECIMAL 7 2'
            'i_brand_id': 'INT'
            'i_brand': 'CHAR 50'
            'i_class_id': 'INT'
            'i_class': 'CHAR 50'
            'i_category_id': 'INT'
            'i_category': 'CHAR 50'
            'i_manufact_id': 'INT'
            'i_manufact': 'CHAR 50'
            'i_size': 'CHAR 20'
            'i_formulation': 'CHAR 20'
            'i_color': 'CHAR 20'
            'i_units': 'CHAR 10'
            'i_container': 'CHAR 10'
            'i_manager_id': 'INT'
            'i_product_name': 'CHAR 50'
    WebSales:
        file: benchmark/tpcds/data/web_sales.csv
        lines_in_file: 719385
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ws_sold_date_sk': 'INT'
            'ws_sold_time_sk': 'INT'
            'ws_ship_date_sk': 'INT'
            'ws_item_sk': 'INT NOT NULL'
            'ws_bill_customer_sk': 'INT'
            'ws_bill_cdemo_sk': 'INT'
            'ws_bill_hdemo_sk': 'INT'
            'ws_bill_addr_sk': 'INT'
            'ws_ship_customer_sk': 'INT'
            'ws_ship_cdemo_sk': 'INT'
            'ws_ship_hdemo_sk': 'INT'
            'ws_ship_addr_sk': 'INT'
            'ws_web_page_sk': 'INT'
            'ws_web_site_sk': 'INT'
            'ws_ship_mode_sk': 'INT'
            'ws_warehouse_sk': 'INT'
            'ws_promo_sk': 'INT'
            'ws_order_number': 'INT NOT NULL'
            'ws_quantity': 'INT'
            'ws_wholesale_cost': 'DECIMAL 7 2'
            'ws_list_price': 'DECIMAL 7 2'
            'ws_sales_price': 'DECIMAL 7 2'
            'ws_ext_discount_amt': 'DECIMAL 7 2'
            'ws_ext_sales_price': 'DECIMAL 7 2'
            'ws_ext_wholesale_cost': 'DECIMAL 7 2'
            'ws_ext_list_price': 'DECIMAL 7 2'
            'ws_ext_tax': 'DECIMAL 7 2'
            'ws_coupon_amt': 'DECIMAL 7 2'
            'ws_ext_ship_cost': 'DECIMAL 7 2'
            'ws_net_paid': 'DECIMAL 7 2'
            'ws_net_paid_inc_tax': 'DECIMAL 7 2'
            'ws_net_paid_inc_ship': 'DECIMAL 7 2'
            'ws_net_paid_inc_ship_tax': 'DECIMAL 7 2'
            'ws_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                 with results as
                ( select sum(ws_net_paid) as total_sum, i_category, i_class, 0 as g_category, 0 as g_class 
                 from
                    web_sales
                   ,date_dim       d1
                   ,item
                 where
                    d1.d_month_seq between 1200 and 1200+11
                 and d1.d_date_sk = ws_sold_date_sk
                 and i_item_sk  = ws_item_sk
                 group by i_category,i_class
                 ) ,
                
                 results_rollup as
                ( select total_sum ,i_category ,i_class, g_category, g_class, 0 as lochierarchy from results
                  union
                  select sum(total_sum) as total_sum, i_category, NULL as i_class, 0 as g_category, 1 as g_class, 1 as lochierarchy from results group by i_category
                  union
                  select sum(total_sum) as total_sum, NULL as i_category, NULL as i_class, 1 as g_category, 1 as g_class, 2 as lochierarchy from results)
                select 
                 total_sum ,i_category ,i_class, lochierarchy 
                   ,rank() over (
                  partition by lochierarchy,
                  case when g_class = 0 then i_category end 
                  order by total_sum desc) as rank_within_parent
                 from
                 results_rollup
                 order by
                   lochierarchy desc,
                   case when lochierarchy = 0 then i_category end,
                   rank_within_parent 
                LIMIT 100;
