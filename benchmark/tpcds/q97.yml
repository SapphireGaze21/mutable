    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH ssci AS
                  (SELECT ss_customer_sk customer_sk ,
                          ss_item_sk item_sk
                   FROM store_sales,
                        date_dim
                   WHERE ss_sold_date_sk = d_date_sk
                     AND d_month_seq BETWEEN 1200 AND 1200 + 11
                   GROUP BY ss_customer_sk ,
                            ss_item_sk),
                     csci as
                  ( SELECT cs_bill_customer_sk customer_sk ,cs_item_sk item_sk
                   FROM catalog_sales,date_dim
                   WHERE cs_sold_date_sk = d_date_sk
                     AND d_month_seq BETWEEN 1200 AND 1200 + 11
                   GROUP BY cs_bill_customer_sk ,cs_item_sk)
                SELECT sum(CASE
                               WHEN ssci.customer_sk IS NOT NULL
                                    AND csci.customer_sk IS NULL THEN 1
                               ELSE 0
                           END) store_only ,
                       sum(CASE
                               WHEN ssci.customer_sk IS NULL
                                    AND csci.customer_sk IS NOT NULL THEN 1
                               ELSE 0
                           END) catalog_only ,
                       sum(CASE
                               WHEN ssci.customer_sk IS NOT NULL
                                    AND csci.customer_sk IS NOT NULL THEN 1
                               ELSE 0
                           END) store_and_catalog
                FROM ssci
                FULL OUTER JOIN csci ON (ssci.customer_sk=csci.customer_sk
                                         AND ssci.item_sk = csci.item_sk)
                LIMIT 100;
                
