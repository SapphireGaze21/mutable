            'ca_address_id': 'CHAR 16 NOT NULL'
            'ca_street_number': 'CHAR 10'
            'ca_street_name': 'CHAR 60'
            'ca_street_type': 'CHAR 15'
            'ca_suite_number': 'CHAR 10'
            'ca_city': 'CHAR 60'
            'ca_county': 'CHAR 30'
            'ca_state': 'CHAR 2'
            'ca_zip': 'CHAR 10'
            'ca_country': 'CHAR 20'
            'ca_gmt_offset': 'DECIMAL 5 2'
            'ca_location_type': 'CHAR 20'
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT count(DISTINCT cs_order_number) AS order count,
                       sum(cs_ext_ship_cost) AS total shipping cost,
                       sum(cs_net_profit) AS total net profit
                FROM catalog_sales cs1,
                     date_dim,
                     customer_address,
                     call_center
                WHERE d_date BETWEEN '2002-02-01' AND cast('2002-04-02' AS date)
                  AND cs1.cs_ship_date_sk = d_date_sk
                  AND cs1.cs_ship_addr_sk = ca_address_sk
                  AND ca_state = 'GA'
                  AND cs1.cs_call_center_sk = cc_call_center_sk
                  AND cc_county = 'Williamson County'
                  AND EXISTS
                    (SELECT *
                     FROM catalog_sales cs2
                     WHERE cs1.cs_order_number = cs2.cs_order_number
                       AND cs1.cs_warehouse_sk <> cs2.cs_warehouse_sk)
                  AND NOT EXISTS
                    (SELECT *
                     FROM catalog_returns cr1
                     WHERE cs1.cs_order_number = cr1.cr_order_number)
                ORDER BY count(DISTINCT cs_order_number)
                LIMIT 100;
                
