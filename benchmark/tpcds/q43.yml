description: TPC-DS Query 43
suite: TPC
benchmark: TPC-DS
name: Q43
readonly: true
data:
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    Store:
        file: benchmark/tpcds/data/store.csv
        lines_in_file: 13
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            's_store_sk': 'INT NOT NULL'
            's_store_id': 'CHAR 16 NOT NULL'
            's_rec_start_date': 'DATE'
            's_rec_end_date': 'DATE'
            's_closed_date_sk': 'INT'
            's_store_name': 'CHAR 50'
            's_number_employees': 'INT'
            's_floor_space': 'INT'
            's_hours': 'CHAR 20'
            's_manager': 'CHAR 40'
            's_market_id': 'INT'
            's_geography_class': 'CHAR 100'
            's_market_desc': 'CHAR 100'
            's_market_manager': 'CHAR 40'
            's_division_id': 'INT'
            's_division_name': 'CHAR 50'
            's_company_id': 'INT'
            's_company_name': 'CHAR 50'
            's_street_number': 'CHAR 10'
            's_street_name': 'CHAR 60'
            's_street_type': 'CHAR 15'
            's_suite_number': 'CHAR 10'
            's_city': 'CHAR 60'
            's_county': 'CHAR 30'
            's_state': 'CHAR 2'
            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                
                SELECT s_store_name,
                       s_store_id,
                       sum(CASE
                               WHEN (d_day_name='Sunday') THEN ss_sales_price
                               ELSE NULL
                           END) sun_sales,
                       sum(CASE
                               WHEN (d_day_name='Monday') THEN ss_sales_price
                               ELSE NULL
                           END) mon_sales,
                       sum(CASE
                               WHEN (d_day_name='Tuesday') THEN ss_sales_price
                               ELSE NULL
                           END) tue_sales,
                       sum(CASE
                               WHEN (d_day_name='Wednesday') THEN ss_sales_price
                               ELSE NULL
                           END) wed_sales,
                       sum(CASE
                               WHEN (d_day_name='Thursday') THEN ss_sales_price
                               ELSE NULL
                           END) thu_sales,
                       sum(CASE
                               WHEN (d_day_name='Friday') THEN ss_sales_price
                               ELSE NULL
                           END) fri_sales,
                       sum(CASE
                               WHEN (d_day_name='Saturday') THEN ss_sales_price
                               ELSE NULL
                           END) sat_sales
                FROM date_dim,
                     store_sales,
                     store
                WHERE d_date_sk = ss_sold_date_sk
                  AND s_store_sk = ss_store_sk
                  AND s_gmt_offset = -5
                  AND d_year = 2000
                GROUP BY s_store_name,
                         s_store_id
                ORDER BY s_store_name,
                         s_store_id,
                         sun_sales,
                         mon_sales,
                         tue_sales,
                         wed_sales,
                         thu_sales,
                         fri_sales,
                         sat_sales
                LIMIT 100;
                
