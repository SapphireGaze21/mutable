            's_hours': 'CHAR 20'
            's_manager': 'CHAR 40'
            's_market_id': 'INT'
            's_geography_class': 'CHAR 100'
            's_market_desc': 'CHAR 100'
            's_market_manager': 'CHAR 40'
            's_division_id': 'INT'
            's_division_name': 'CHAR 50'
            's_company_id': 'INT'
            's_company_name': 'CHAR 50'
            's_street_number': 'CHAR 10'
            's_street_name': 'CHAR 60'
            's_street_type': 'CHAR 15'
            's_suite_number': 'CHAR 10'
            's_city': 'CHAR 60'
            's_county': 'CHAR 30'
            's_state': 'CHAR 2'
            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreReturns:
        file: benchmark/tpcds/data/store_returns.csv
        lines_in_file: 287868
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'sr_returned_date_sk': 'INT'
            'sr_return_time_sk': 'INT'
            'sr_item_sk': 'INT NOT NULL'
            'sr_customer_sk': 'INT'
            'sr_cdemo_sk': 'INT'
            'sr_hdemo_sk': 'INT'
            'sr_addr_sk': 'INT'
            'sr_store_sk': 'INT'
            'sr_reason_sk': 'INT'
            'sr_ticket_number': 'INT NOT NULL'
            'sr_return_quantity': 'INT'
            'sr_return_amt': 'DECIMAL 7 2'
            'sr_return_tax': 'DECIMAL 7 2'
            'sr_return_amt_inc_tax': 'DECIMAL 7 2'
            'sr_fee': 'DECIMAL 7 2'
            'sr_return_ship_cost': 'DECIMAL 7 2'
            'sr_refunded_cash': 'DECIMAL 7 2'
            'sr_reversed_charge': 'DECIMAL 7 2'
            'sr_store_credit': 'DECIMAL 7 2'
            'sr_net_loss': 'DECIMAL 7 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT s_store_name,
                       s_company_id,
                       s_street_number,
                       s_street_name,
                       s_street_type,
                       s_suite_number,
                       s_city,
                       s_county,
                       s_state,
                       s_zip,
                       sum(CASE
                               WHEN (sr_returned_date_sk - ss_sold_date_sk <= 30) THEN 1
                               ELSE 0
                           END) AS 30 days,
                       sum(CASE
                               WHEN (sr_returned_date_sk - ss_sold_date_sk > 30)
                                    AND (sr_returned_date_sk - ss_sold_date_sk <= 60) THEN 1
                               ELSE 0
                           END) AS 31-60 days,
                       sum(CASE
                               WHEN (sr_returned_date_sk - ss_sold_date_sk > 60)
                                    AND (sr_returned_date_sk - ss_sold_date_sk <= 90) THEN 1
                               ELSE 0
                           END) AS 61-90 days,
                       sum(CASE
                               WHEN (sr_returned_date_sk - ss_sold_date_sk > 90)
                                    AND (sr_returned_date_sk - ss_sold_date_sk <= 120) THEN 1
                               ELSE 0
                           END) AS 91-120 days,
                       sum(CASE
                               WHEN (sr_returned_date_sk - ss_sold_date_sk > 120) THEN 1
                               ELSE 0
                           END) AS >120 days
                FROM store_sales,
                     store_returns,
                     store,
                     date_dim d1,
                     date_dim d2
                WHERE d2.d_year = 2001
                  AND d2.d_moy = 8
                  AND ss_ticket_number = sr_ticket_number
                  AND ss_item_sk = sr_item_sk
                  AND ss_sold_date_sk = d1.d_date_sk
                  AND sr_returned_date_sk = d2.d_date_sk
                  AND ss_customer_sk = sr_customer_sk
                  AND ss_store_sk = s_store_sk
                GROUP BY s_store_name,
                         s_company_id,
                         s_street_number,
                         s_street_name,
                         s_street_type,
                         s_suite_number,
                         s_city,
                         s_county,
                         s_state,
                         s_zip
                ORDER BY s_store_name,
                         s_company_id,
                         s_street_number,
                         s_street_name,
                         s_street_type,
                         s_suite_number,
                         s_city,
                         s_county,
                         s_state,
                         s_zip
                LIMIT 100;
                
    PostgreSQL:
        cases:
            1: |
                SELECT s_store_name,
                       s_company_id,
                       s_street_number,
                       s_street_name,
                       s_street_type,
                       s_suite_number,
