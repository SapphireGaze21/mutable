description: TPC-DS Query 26
suite: TPC
benchmark: TPC-DS
name: Q26
readonly: true
data:
    CatalogSales:
        file: benchmark/tpcds/data/catalog_sales.csv
        lines_in_file: 1441549
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'cs_sold_date_sk': 'INT'
            'cs_sold_time_sk': 'INT'
            'cs_ship_date_sk': 'INT'
            'cs_bill_customer_sk': 'INT'
            'cs_bill_cdemo_sk': 'INT'
            'cs_bill_hdemo_sk': 'INT'
            'cs_bill_addr_sk': 'INT'
            'cs_ship_customer_sk': 'INT'
            'cs_ship_cdemo_sk': 'INT'
            'cs_ship_hdemo_sk': 'INT'
            'cs_ship_addr_sk': 'INT'
            'cs_call_center_sk': 'INT'
            'cs_catalog_page_sk': 'INT'
            'cs_ship_mode_sk': 'INT'
            'cs_warehouse_sk': 'INT'
            'cs_item_sk': 'INT NOT NULL'
            'cs_promo_sk': 'INT'
            'cs_order_number': 'INT NOT NULL'
            'cs_quantity': 'INT'
            'cs_wholesale_cost': 'DECIMAL 7 2'
            'cs_list_price': 'DECIMAL 7 2'
            'cs_sales_price': 'DECIMAL 7 2'
            'cs_ext_discount_amt': 'DECIMAL 7 2'
            'cs_ext_sales_price': 'DECIMAL 7 2'
            'cs_ext_wholesale_cost': 'DECIMAL 7 2'
            'cs_ext_list_price': 'DECIMAL 7 2'
            'cs_ext_tax': 'DECIMAL 7 2'
            'cs_coupon_amt': 'DECIMAL 7 2'
            'cs_ext_ship_cost': 'DECIMAL 7 2'
            'cs_net_paid': 'DECIMAL 7 2'
            'cs_net_paid_inc_tax': 'DECIMAL 7 2'
            'cs_net_paid_inc_ship': 'DECIMAL 7 2'
            'cs_net_paid_inc_ship_tax': 'DECIMAL 7 2'
            'cs_net_profit': 'DECIMAL 7 2'
    CustomerDemographics:
        file: benchmark/tpcds/data/customer_demographics.csv
        lines_in_file: 1920801
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'cd_demo_sk': 'INT NOT NULL'
            'cd_gender': 'CHAR 1'
            'cd_marital_status': 'CHAR 1'
            'cd_education_status': 'CHAR 20'
            'cd_purchase_estimate': 'INT'
            'cd_credit_rating': 'CHAR 10'
            'cd_dep_count': 'INT'
            'cd_dep_employed_count': 'INT'
            'cd_dep_college_count': 'INT'
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    Item:
        file: benchmark/tpcds/data/item.csv
        lines_in_file: 18001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'i_item_sk': 'INT NOT NULL'
            'i_item_id': 'CHAR 16 NOT NULL'
            'i_rec_start_date': 'DATE'
            'i_rec_end_date': 'DATE'
            'i_item_desc': 'CHAR 200'
            'i_current_price': 'DECIMAL 7 2'
            'i_wholesale_cost': 'DECIMAL 7 2'
            'i_brand_id': 'INT'
            'i_brand': 'CHAR 50'
            'i_class_id': 'INT'
            'i_class': 'CHAR 50'
            'i_category_id': 'INT'
            'i_category': 'CHAR 50'
            'i_manufact_id': 'INT'
            'i_manufact': 'CHAR 50'
            'i_size': 'CHAR 20'
            'i_formulation': 'CHAR 20'
            'i_color': 'CHAR 20'
            'i_units': 'CHAR 10'
            'i_container': 'CHAR 10'
            'i_manager_id': 'INT'
            'i_product_name': 'CHAR 50'
    Promotion:
        file: benchmark/tpcds/data/promotion.csv
        lines_in_file: 301
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'p_promo_sk': 'INT NOT NULL'
            'p_promo_id': 'CHAR 16 NOT NULL'
            'p_start_date_sk': 'INT'
            'p_end_date_sk': 'INT'
            'p_item_sk': 'INT'
            'p_cost': 'DECIMAL 15 2'
            'p_response_target': 'INT'
            'p_promo_name': 'CHAR 50'
            'p_channel_dmail': 'CHAR 1'
            'p_channel_email': 'CHAR 1'
            'p_channel_catalog': 'CHAR 1'
            'p_channel_tv': 'CHAR 1'
            'p_channel_radio': 'CHAR 1'
            'p_channel_press': 'CHAR 1'
            'p_channel_event': 'CHAR 1'
            'p_channel_demo': 'CHAR 1'
            'p_channel_details': 'CHAR 100'
            'p_purpose': 'CHAR 15'
            'p_discount_active': 'CHAR 1'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT i_item_id,
                       avg(cs_quantity) agg1,
                       avg(cs_list_price) agg2,
                       avg(cs_coupon_amt) agg3,
                       avg(cs_sales_price) agg4
                FROM catalog_sales,
                     customer_demographics,
                     date_dim,
                     item,
                     promotion
                WHERE cs_sold_date_sk = d_date_sk
                  AND cs_item_sk = i_item_sk
                  AND cs_bill_cdemo_sk = cd_demo_sk
                  AND cs_promo_sk = p_promo_sk
                  AND cd_gender = 'M'
                  AND cd_marital_status = 'S'
                  AND cd_education_status = 'College'
                  AND (p_channel_email = 'N'
                       OR p_channel_event = 'N')
                  AND d_year = 2000
                GROUP BY i_item_id
                ORDER BY i_item_id
                LIMIT 100;
                
    PostgreSQL:
        cases:
            1: |
                SELECT i_item_id,
