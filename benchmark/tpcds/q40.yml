    Warehouse:
        file: benchmark/tpcds/data/warehouse.csv
        lines_in_file: 6
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'w_warehouse_sk': 'INT NOT NULL'
            'w_warehouse_id': 'CHAR 16 NOT NULL'
            'w_warehouse_name': 'CHAR 20'
            'w_warehouse_sq_ft': 'INT'
            'w_street_number': 'CHAR 10'
            'w_street_name': 'CHAR 60'
            'w_street_type': 'CHAR 15'
            'w_suite_number': 'CHAR 10'
            'w_city': 'CHAR 60'
            'w_county': 'CHAR 30'
            'w_state': 'CHAR 2'
            'w_zip': 'CHAR 10'
            'w_country': 'CHAR 20'
            'w_gmt_offset': 'DECIMAL 5 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT w_state,
                       i_item_id,
                       sum(CASE
                               WHEN (cast(d_date AS date) < CAST ('2000-03-11' AS date)) THEN cs_sales_price - coalesce(cr_refunded_cash,0)
                               ELSE 0
                           END) AS sales_before,
                       sum(CASE
                               WHEN (cast(d_date AS date) >= CAST ('2000-03-11' AS date)) THEN cs_sales_price - coalesce(cr_refunded_cash,0)
                               ELSE 0
                           END) AS sales_after
                FROM catalog_sales
                LEFT OUTER JOIN catalog_returns ON (cs_order_number = cr_order_number
                                                    AND cs_item_sk = cr_item_sk) ,warehouse,
                                                                                  item,
                                                                                  date_dim
                WHERE i_current_price BETWEEN 0.99 AND 1.49
                  AND i_item_sk = cs_item_sk
                  AND cs_warehouse_sk = w_warehouse_sk
                  AND cs_sold_date_sk = d_date_sk
                  AND d_date BETWEEN CAST ('2000-02-10' AS date) AND CAST ('2000-04-10' AS date)
                GROUP BY w_state,
                         i_item_id
                ORDER BY w_state,
                         i_item_id
                LIMIT 100;
                
