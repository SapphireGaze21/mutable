description: TPC-DS Query 88
suite: TPC
benchmark: TPC-DS
name: Q88
readonly: true
data:
    HouseholdDemographics:
        file: benchmark/tpcds/data/household_demographics.csv
        lines_in_file: 7201
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'hd_demo_sk': 'INT NOT NULL'
            'hd_income_band_sk': 'INT'
            'hd_buy_potential': 'CHAR 15'
            'hd_dep_count': 'INT'
            'hd_vehicle_count': 'INT'
    Store:
        file: benchmark/tpcds/data/store.csv
        lines_in_file: 13
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            's_store_sk': 'INT NOT NULL'
            's_store_id': 'CHAR 16 NOT NULL'
            's_rec_start_date': 'DATE'
            's_rec_end_date': 'DATE'
            's_closed_date_sk': 'INT'
            's_store_name': 'CHAR 50'
            's_number_employees': 'INT'
            's_floor_space': 'INT'
            's_hours': 'CHAR 20'
            's_manager': 'CHAR 40'
            's_market_id': 'INT'
            's_geography_class': 'CHAR 100'
            's_market_desc': 'CHAR 100'
            's_market_manager': 'CHAR 40'
            's_division_id': 'INT'
            's_division_name': 'CHAR 50'
            's_company_id': 'INT'
            's_company_name': 'CHAR 50'
            's_street_number': 'CHAR 10'
            's_street_name': 'CHAR 60'
            's_street_type': 'CHAR 15'
            's_suite_number': 'CHAR 10'
            's_city': 'CHAR 60'
            's_county': 'CHAR 30'
            's_state': 'CHAR 2'
            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
    TimeDim:
        file: benchmark/tpcds/data/time_dim.csv
        lines_in_file: 86401
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            't_time_sk': 'INT NOT NULL'
            't_time_id': 'CHAR 16 NOT NULL'
            't_time': 'INT'
            't_hour': 'INT'
            't_minute': 'INT'
            't_second': 'INT'
            't_am_pm': 'CHAR 2'
            't_shift': 'CHAR 20'
            't_sub_shift': 'CHAR 20'
            't_meal_time': 'CHAR 20'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT *
                FROM
                  (SELECT count(*) h8_30_to_9
                   FROM store_sales,
                        household_demographics,
                        time_dim,
                        store
                   WHERE ss_sold_time_sk = time_dim.t_time_sk
                     AND ss_hdemo_sk = household_demographics.hd_demo_sk
                     AND ss_store_sk = s_store_sk
                     AND time_dim.t_hour = 8
                     AND time_dim.t_minute >= 30
                     AND ((household_demographics.hd_dep_count = 4
                           AND household_demographics.hd_vehicle_count<=4+2)
                          OR (household_demographics.hd_dep_count = 2
                              AND household_demographics.hd_vehicle_count<=2+2)
                          OR (household_demographics.hd_dep_count = 0
                              AND household_demographics.hd_vehicle_count<=0+2))
                     AND store.s_store_name = 'ese') s1,
                  (SELECT count(*) h9_to_9_30
                   FROM store_sales,
                        household_demographics,
                        time_dim,
                        store
                   WHERE ss_sold_time_sk = time_dim.t_time_sk
                     AND ss_hdemo_sk = household_demographics.hd_demo_sk
                     AND ss_store_sk = s_store_sk
                     AND time_dim.t_hour = 9
                     AND time_dim.t_minute < 30
                     AND ((household_demographics.hd_dep_count = 4
                           AND household_demographics.hd_vehicle_count<=4+2)
                          OR (household_demographics.hd_dep_count = 2
                              AND household_demographics.hd_vehicle_count<=2+2)
                          OR (household_demographics.hd_dep_count = 0
                              AND household_demographics.hd_vehicle_count<=0+2))
                     AND store.s_store_name = 'ese') s2,
                  (SELECT count(*) h9_30_to_10
                   FROM store_sales,
                        household_demographics,
                        time_dim,
                        store
                   WHERE ss_sold_time_sk = time_dim.t_time_sk
                     AND ss_hdemo_sk = household_demographics.hd_demo_sk
                     AND ss_store_sk = s_store_sk
                     AND time_dim.t_hour = 9
