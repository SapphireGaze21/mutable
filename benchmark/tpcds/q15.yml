description: TPC-DS Query 15
suite: TPC
benchmark: TPC-DS
name: Q15
readonly: true
data:
    CatalogSales:
        file: benchmark/tpcds/data/catalog_sales.csv
        lines_in_file: 1441549
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'cs_sold_date_sk': 'INT'
            'cs_sold_time_sk': 'INT'
            'cs_ship_date_sk': 'INT'
            'cs_bill_customer_sk': 'INT'
            'cs_bill_cdemo_sk': 'INT'
            'cs_bill_hdemo_sk': 'INT'
            'cs_bill_addr_sk': 'INT'
            'cs_ship_customer_sk': 'INT'
            'cs_ship_cdemo_sk': 'INT'
            'cs_ship_hdemo_sk': 'INT'
            'cs_ship_addr_sk': 'INT'
            'cs_call_center_sk': 'INT'
            'cs_catalog_page_sk': 'INT'
            'cs_ship_mode_sk': 'INT'
            'cs_warehouse_sk': 'INT'
            'cs_item_sk': 'INT NOT NULL'
            'cs_promo_sk': 'INT'
            'cs_order_number': 'INT NOT NULL'
            'cs_quantity': 'INT'
            'cs_wholesale_cost': 'DECIMAL 7 2'
            'cs_list_price': 'DECIMAL 7 2'
            'cs_sales_price': 'DECIMAL 7 2'
            'cs_ext_discount_amt': 'DECIMAL 7 2'
            'cs_ext_sales_price': 'DECIMAL 7 2'
            'cs_ext_wholesale_cost': 'DECIMAL 7 2'
            'cs_ext_list_price': 'DECIMAL 7 2'
            'cs_ext_tax': 'DECIMAL 7 2'
            'cs_coupon_amt': 'DECIMAL 7 2'
            'cs_ext_ship_cost': 'DECIMAL 7 2'
            'cs_net_paid': 'DECIMAL 7 2'
            'cs_net_paid_inc_tax': 'DECIMAL 7 2'
            'cs_net_paid_inc_ship': 'DECIMAL 7 2'
            'cs_net_paid_inc_ship_tax': 'DECIMAL 7 2'
            'cs_net_profit': 'DECIMAL 7 2'
    Customer:
        file: benchmark/tpcds/data/customer.csv
        lines_in_file: 100001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'c_customer_sk': 'INT NOT NULL'
            'c_customer_id': 'CHAR 16 NOT NULL'
            'c_current_cdemo_sk': 'INT'
            'c_current_hdemo_sk': 'INT'
            'c_current_addr_sk': 'INT'
            'c_first_shipto_date_sk': 'INT'
            'c_first_sales_date_sk': 'INT'
            'c_salutation': 'CHAR 10'
            'c_first_name': 'CHAR 20'
            'c_last_name': 'CHAR 30'
            'c_preferred_cust_flag': 'CHAR 1'
            'c_birth_day': 'INT'
            'c_birth_month': 'INT'
            'c_birth_year': 'INT'
            'c_birth_country': 'CHAR 20'
            'c_login': 'CHAR 13'
            'c_email_address': 'CHAR 50'
            'c_last_review_date_sk': 'INT'
    CustomerAddress:
        file: benchmark/tpcds/data/customer_address.csv
        lines_in_file: 50001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ca_address_sk': 'INT NOT NULL'
            'ca_address_id': 'CHAR 16 NOT NULL'
            'ca_street_number': 'CHAR 10'
            'ca_street_name': 'CHAR 60'
            'ca_street_type': 'CHAR 15'
            'ca_suite_number': 'CHAR 10'
            'ca_city': 'CHAR 60'
            'ca_county': 'CHAR 30'
            'ca_state': 'CHAR 2'
            'ca_zip': 'CHAR 10'
            'ca_country': 'CHAR 20'
            'ca_gmt_offset': 'DECIMAL 5 2'
            'ca_location_type': 'CHAR 20'
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT ca_zip,
                       sum(cs_sales_price)
                FROM catalog_sales,
                     customer,
                     customer_address,
                     date_dim
                WHERE cs_bill_customer_sk = c_customer_sk
                  AND c_current_addr_sk = ca_address_sk
                  AND (SUBSTRING(ca_zip, 1, 5) IN ('85669',
                                                '86197',
                                                '88274',
                                                '83405',
                                                '86475',
                                                '85392',
                                                '85460',
                                                '80348',
                                                '81792')
                       OR ca_state IN ('CA',
                                       'WA',
                                       'GA')
                       OR cs_sales_price > 500)
                  AND cs_sold_date_sk = d_date_sk
                  AND d_qoy = 2
                  AND d_year = 2001
                GROUP BY ca_zip
                ORDER BY ca_zip
                LIMIT 100;
                
