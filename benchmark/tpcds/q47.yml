description: TPC-DS Query 47
suite: TPC
benchmark: TPC-DS
name: Q47
readonly: true
data:
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    Item:
        file: benchmark/tpcds/data/item.csv
        lines_in_file: 18001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'i_item_sk': 'INT NOT NULL'
            'i_item_id': 'CHAR 16 NOT NULL'
            'i_rec_start_date': 'DATE'
            'i_rec_end_date': 'DATE'
            'i_item_desc': 'CHAR 200'
            'i_current_price': 'DECIMAL 7 2'
            'i_wholesale_cost': 'DECIMAL 7 2'
            'i_brand_id': 'INT'
            'i_brand': 'CHAR 50'
            'i_class_id': 'INT'
            'i_class': 'CHAR 50'
            'i_category_id': 'INT'
            'i_category': 'CHAR 50'
            'i_manufact_id': 'INT'
            'i_manufact': 'CHAR 50'
            'i_size': 'CHAR 20'
            'i_formulation': 'CHAR 20'
            'i_color': 'CHAR 20'
            'i_units': 'CHAR 10'
            'i_container': 'CHAR 10'
            'i_manager_id': 'INT'
            'i_product_name': 'CHAR 50'
    Store:
        file: benchmark/tpcds/data/store.csv
        lines_in_file: 13
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            's_store_sk': 'INT NOT NULL'
            's_store_id': 'CHAR 16 NOT NULL'
            's_rec_start_date': 'DATE'
            's_rec_end_date': 'DATE'
