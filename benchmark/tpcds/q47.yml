            's_store_name': 'CHAR 50'
            's_number_employees': 'INT'
            's_floor_space': 'INT'
            's_hours': 'CHAR 20'
            's_manager': 'CHAR 40'
            's_market_id': 'INT'
            's_geography_class': 'CHAR 100'
            's_market_desc': 'CHAR 100'
            's_market_manager': 'CHAR 40'
            's_division_id': 'INT'
            's_division_name': 'CHAR 50'
            's_company_id': 'INT'
            's_company_name': 'CHAR 50'
            's_street_number': 'CHAR 10'
            's_street_name': 'CHAR 60'
            's_street_type': 'CHAR 15'
            's_suite_number': 'CHAR 10'
            's_city': 'CHAR 60'
            's_county': 'CHAR 30'
            's_state': 'CHAR 2'
            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH v1 AS
                  (SELECT i_category,
                          i_brand,
                          s_store_name,
                          s_company_name,
                          d_year,
                          d_moy,
                          sum(ss_sales_price) sum_sales,
                          avg(sum(ss_sales_price)) OVER (PARTITION BY i_category,
                                                                      i_brand,
                                                                      s_store_name,
                                                                      s_company_name,
                                                                      d_year) avg_monthly_sales,
                                                        rank() OVER (PARTITION BY i_category,
                                                                                  i_brand,
                                                                                  s_store_name,
                                                                                  s_company_name
                                                                     ORDER BY d_year,
                                                                              d_moy) rn
                   FROM item,
                        store_sales,
                        date_dim,
                        store
                   WHERE ss_item_sk = i_item_sk
                     AND ss_sold_date_sk = d_date_sk
                     AND ss_store_sk = s_store_sk
                     AND (d_year = 1999
                          OR (d_year = 1999-1
                              AND d_moy =12)
                          OR (d_year = 1999+1
                              AND d_moy =1))
                   GROUP BY i_category,
                            i_brand,
                            s_store_name,
                            s_company_name,
                            d_year,
                            d_moy),
                     v2 AS
                  (SELECT v1.i_category,
                          v1.i_brand,
                          v1.s_store_name,
                          v1.s_company_name,
                          v1.d_year,
                          v1.d_moy,
                          v1.avg_monthly_sales,
                          v1.sum_sales,
                          v1_lag.sum_sales psum,
                          v1_lead.sum_sales nsum
                   FROM v1,
                        v1 v1_lag,
                        v1 v1_lead
                   WHERE v1.i_category = v1_lag.i_category
                     AND v1.i_category = v1_lead.i_category
                     AND v1.i_brand = v1_lag.i_brand
                     AND v1.i_brand = v1_lead.i_brand
                     AND v1.s_store_name = v1_lag.s_store_name
                     AND v1.s_store_name = v1_lead.s_store_name
                     AND v1.s_company_name = v1_lag.s_company_name
                     AND v1.s_company_name = v1_lead.s_company_name
                     AND v1.rn = v1_lag.rn + 1
                     AND v1.rn = v1_lead.rn - 1)
                SELECT *
                FROM v2
                WHERE d_year = 1999
                  AND avg_monthly_sales > 0
                  AND CASE
                          WHEN avg_monthly_sales > 0 THEN abs(sum_sales - avg_monthly_sales) / avg_monthly_sales
                          ELSE NULL
                      END > 0.1
                ORDER BY sum_sales - avg_monthly_sales
                LIMIT 100;
                
