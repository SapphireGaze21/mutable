            'c_birth_day': 'INT'
            'c_birth_month': 'INT'
            'c_birth_year': 'INT'
            'c_birth_country': 'CHAR 20'
            'c_login': 'CHAR 13'
            'c_email_address': 'CHAR 50'
            'c_last_review_date_sk': 'INT'
    CustomerAddress:
