description: TPC-DS Query 19
suite: TPC
benchmark: TPC-DS
name: Q19
readonly: true
data:
    Customer:
        file: benchmark/tpcds/data/customer.csv
        lines_in_file: 100001
        format: 'CSV'
        delimiter: ','
        header: 1
