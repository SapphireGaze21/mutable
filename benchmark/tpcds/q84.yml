description: TPC-DS Query 84
suite: TPC
benchmark: TPC-DS
name: Q84
readonly: true
data:
    Customer:
        file: benchmark/tpcds/data/customer.csv
        lines_in_file: 100001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'c_customer_sk': 'INT NOT NULL'
            'c_customer_id': 'CHAR 16 NOT NULL'
            'c_current_cdemo_sk': 'INT'
            'c_current_hdemo_sk': 'INT'
            'c_current_addr_sk': 'INT'
            'c_first_shipto_date_sk': 'INT'
            'c_first_sales_date_sk': 'INT'
            'c_salutation': 'CHAR 10'
            'c_first_name': 'CHAR 20'
            'c_last_name': 'CHAR 30'
            'c_preferred_cust_flag': 'CHAR 1'
            'c_birth_day': 'INT'
            'c_birth_month': 'INT'
            'c_birth_year': 'INT'
            'c_birth_country': 'CHAR 20'
            'c_login': 'CHAR 13'
            'c_email_address': 'CHAR 50'
            'c_last_review_date_sk': 'INT'
    CustomerAddress:
        file: benchmark/tpcds/data/customer_address.csv
        lines_in_file: 50001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ca_address_sk': 'INT NOT NULL'
            'ca_address_id': 'CHAR 16 NOT NULL'
            'ca_street_number': 'CHAR 10'
            'ca_street_name': 'CHAR 60'
            'ca_street_type': 'CHAR 15'
            'ca_suite_number': 'CHAR 10'
            'ca_city': 'CHAR 60'
            'ca_county': 'CHAR 30'
            'ca_state': 'CHAR 2'
            'ca_zip': 'CHAR 10'
            'ca_country': 'CHAR 20'
            'ca_gmt_offset': 'DECIMAL 5 2'
            'ca_location_type': 'CHAR 20'
    CustomerDemographics:
        file: benchmark/tpcds/data/customer_demographics.csv
        lines_in_file: 1920801
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'cd_demo_sk': 'INT NOT NULL'
            'cd_gender': 'CHAR 1'
            'cd_marital_status': 'CHAR 1'
            'cd_education_status': 'CHAR 20'
            'cd_purchase_estimate': 'INT'
            'cd_credit_rating': 'CHAR 10'
            'cd_dep_count': 'INT'
            'cd_dep_employed_count': 'INT'
            'cd_dep_college_count': 'INT'
    HouseholdDemographics:
        file: benchmark/tpcds/data/household_demographics.csv
        lines_in_file: 7201
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'hd_demo_sk': 'INT NOT NULL'
            'hd_income_band_sk': 'INT'
            'hd_buy_potential': 'CHAR 15'
            'hd_dep_count': 'INT'
            'hd_vehicle_count': 'INT'
    IncomeBand:
        file: benchmark/tpcds/data/income_band.csv
        lines_in_file: 21
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ib_income_band_sk': 'INT NOT NULL'
            'ib_lower_bound': 'INT'
            'ib_upper_bound': 'INT'
    StoreReturns:
        file: benchmark/tpcds/data/store_returns.csv
        lines_in_file: 287868
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'sr_returned_date_sk': 'INT'
            'sr_return_time_sk': 'INT'
            'sr_item_sk': 'INT NOT NULL'
            'sr_customer_sk': 'INT'
            'sr_cdemo_sk': 'INT'
            'sr_hdemo_sk': 'INT'
            'sr_addr_sk': 'INT'
            'sr_store_sk': 'INT'
            'sr_reason_sk': 'INT'
            'sr_ticket_number': 'INT NOT NULL'
            'sr_return_quantity': 'INT'
            'sr_return_amt': 'DECIMAL 7 2'
            'sr_return_tax': 'DECIMAL 7 2'
            'sr_return_amt_inc_tax': 'DECIMAL 7 2'
            'sr_fee': 'DECIMAL 7 2'
            'sr_return_ship_cost': 'DECIMAL 7 2'
            'sr_refunded_cash': 'DECIMAL 7 2'
            'sr_reversed_charge': 'DECIMAL 7 2'
            'sr_store_credit': 'DECIMAL 7 2'
            'sr_net_loss': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT c_customer_id AS customer_id ,
                       concat(concat(coalesce(c_last_name, '') , ', '), coalesce(c_first_name, '')) AS customername
                FROM customer ,
                     customer_address ,
                     customer_demographics ,
                     household_demographics ,
                     income_band ,
                     store_returns
                WHERE ca_city = 'Edgewood'
                  AND c_current_addr_sk = ca_address_sk
                  AND ib_lower_bound >= 38128
                  AND ib_upper_bound <= 38128 + 50000
                  AND ib_income_band_sk = hd_income_band_sk
                  AND cd_demo_sk = c_current_cdemo_sk
                  AND hd_demo_sk = c_current_hdemo_sk
                  AND sr_cdemo_sk = cd_demo_sk
                ORDER BY c_customer_id
                LIMIT 100;
    PostgreSQL:
        cases:
            1: |
                SELECT c_customer_id AS customer_id ,
                       concat(concat(coalesce(c_last_name, '') , ', '), coalesce(c_first_name, '')) AS customername
                FROM customer ,
                     customer_address ,
                     customer_demographics ,
                     household_demographics ,
                     income_band ,
                     store_returns
                WHERE ca_city = 'Edgewood'
                  AND c_current_addr_sk = ca_address_sk
                  AND ib_lower_bound >= 38128
                  AND ib_upper_bound <= 38128 + 50000
                  AND ib_income_band_sk = hd_income_band_sk
                  AND cd_demo_sk = c_current_cdemo_sk
                  AND hd_demo_sk = c_current_hdemo_sk
                  AND sr_cdemo_sk = cd_demo_sk
                ORDER BY c_customer_id
                LIMIT 100;
    DuckDB:
        cases:
            1: |
                SELECT c_customer_id AS customer_id ,
                       concat(concat(coalesce(c_last_name, '') , ', '), coalesce(c_first_name, '')) AS customername
                FROM customer ,
                     customer_address ,
                     customer_demographics ,
                     household_demographics ,
                     income_band ,
                     store_returns
                WHERE ca_city = 'Edgewood'
                  AND c_current_addr_sk = ca_address_sk
                  AND ib_lower_bound >= 38128
                  AND ib_upper_bound <= 38128 + 50000
                  AND ib_income_band_sk = hd_income_band_sk
                  AND cd_demo_sk = c_current_cdemo_sk
                  AND hd_demo_sk = c_current_hdemo_sk
                  AND sr_cdemo_sk = cd_demo_sk
                ORDER BY c_customer_id
                LIMIT 100;
    HyPer:
        cases:
            1: |
                SELECT c_customer_id AS customer_id ,
                       concat(concat(coalesce(c_last_name, '') , ', '), coalesce(c_first_name, '')) AS customername
                FROM customer ,
                     customer_address ,
                     customer_demographics ,
                     household_demographics ,
                     income_band ,
                     store_returns
                WHERE ca_city = 'Edgewood'
                  AND c_current_addr_sk = ca_address_sk
                  AND ib_lower_bound >= 38128
                  AND ib_upper_bound <= 38128 + 50000
                  AND ib_income_band_sk = hd_income_band_sk
                  AND cd_demo_sk = c_current_cdemo_sk
                  AND hd_demo_sk = c_current_hdemo_sk
                  AND sr_cdemo_sk = cd_demo_sk
                ORDER BY c_customer_id
                LIMIT 100;
