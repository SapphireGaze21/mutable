            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH results AS
                  (SELECT i_item_id,
                          s_state,
                          0 AS g_state,
                          ss_quantity agg1,
                          ss_list_price agg2,
                          ss_coupon_amt agg3,
                          ss_sales_price agg4
                   FROM store_sales,
                        customer_demographics,
                        date_dim,
                        store,
                        item
                   WHERE ss_sold_date_sk = d_date_sk
                     AND ss_item_sk = i_item_sk
                     AND ss_store_sk = s_store_sk
                     AND ss_cdemo_sk = cd_demo_sk
                     AND cd_gender = 'M'
                     AND cd_marital_status = 'S'
                     AND cd_education_status = 'College'
                     AND d_year = 2002
                     AND s_state = 'TN' )
                SELECT i_item_id,
                       s_state,
                       g_state,
                       agg1,
                       agg2,
                       agg3,
                       agg4
                FROM
                  ( SELECT i_item_id,
                           s_state,
                           0 AS g_state,
                           avg(agg1) agg1,
                           avg(agg2) agg2,
                           avg(agg3) agg3,
                           avg(agg4) agg4
                   FROM results
                   GROUP BY i_item_id ,
                            s_state
                   UNION ALL SELECT i_item_id,
                                    NULL AS s_state,
                                    1 AS g_state,
                                    avg(agg1) agg1,
                                    avg(agg2) agg2,
                                    avg(agg3) agg3,
                                    avg(agg4) agg4
                   FROM results
                   GROUP BY i_item_id
                   UNION ALL SELECT NULL AS i_item_id,
                                    NULL AS s_state,
                                    1 AS g_state,
                                    avg(agg1) agg1,
                                    avg(agg2) agg2,
                                    avg(agg3) agg3,
                                    avg(agg4) agg4
                   FROM results ) foo
                ORDER BY i_item_id,
                         s_state
                LIMIT 100;
