            's_number_employees': 'INT'
            's_floor_space': 'INT'
            's_hours': 'CHAR 20'
            's_manager': 'CHAR 40'
            's_market_id': 'INT'
            's_geography_class': 'CHAR 100'
            's_market_desc': 'CHAR 100'
            's_market_manager': 'CHAR 40'
            's_division_id': 'INT'
            's_division_name': 'CHAR 50'
            's_company_id': 'INT'
            's_company_name': 'CHAR 50'
            's_street_number': 'CHAR 10'
            's_street_name': 'CHAR 60'
            's_street_type': 'CHAR 15'
            's_suite_number': 'CHAR 10'
            's_city': 'CHAR 60'
            's_county': 'CHAR 30'
            's_state': 'CHAR 2'
            's_zip': 'CHAR 10'
            's_country': 'CHAR 20'
            's_gmt_offset': 'DECIMAL 5 2'
            's_tax_precentage': 'DECIMAL 5 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH wss AS
                  (SELECT d_week_seq,
                          ss_store_sk,
                          sum(CASE
                                  WHEN (d_day_name='Sunday') THEN ss_sales_price
                                  ELSE NULL
                              END) sun_sales,
                          sum(CASE
                                  WHEN (d_day_name='Monday') THEN ss_sales_price
                                  ELSE NULL
                              END) mon_sales,
                          sum(CASE
                                  WHEN (d_day_name='Tuesday') THEN ss_sales_price
                                  ELSE NULL
                              END) tue_sales,
                          sum(CASE
                                  WHEN (d_day_name='Wednesday') THEN ss_sales_price
                                  ELSE NULL
                              END) wed_sales,
                          sum(CASE
                                  WHEN (d_day_name='Thursday') THEN ss_sales_price
                                  ELSE NULL
                              END) thu_sales,
                          sum(CASE
                                  WHEN (d_day_name='Friday') THEN ss_sales_price
                                  ELSE NULL
                              END) fri_sales,
                          sum(CASE
                                  WHEN (d_day_name='Saturday') THEN ss_sales_price
                                  ELSE NULL
                              END) sat_sales
                   FROM store_sales,
                        date_dim
                   WHERE d_date_sk = ss_sold_date_sk
                   GROUP BY d_week_seq,
                            ss_store_sk)
                SELECT s_store_name1,
                       s_store_id1,
                       d_week_seq1,
                       sun_sales1/sun_sales2,
                       mon_sales1/mon_sales2,
                       tue_sales1/tue_sales2,
                       wed_sales1/wed_sales2,
                       thu_sales1/thu_sales2,
                       fri_sales1/fri_sales2,
                       sat_sales1/sat_sales2
                FROM
                  (SELECT s_store_name s_store_name1,
                          wss.d_week_seq d_week_seq1,
                          s_store_id s_store_id1,
                          sun_sales sun_sales1,
                          mon_sales mon_sales1,
                          tue_sales tue_sales1,
                          wed_sales wed_sales1,
                          thu_sales thu_sales1,
                          fri_sales fri_sales1,
                          sat_sales sat_sales1
                   FROM wss,
                        store,
                        date_dim d
                   WHERE d.d_week_seq = wss.d_week_seq
                     AND ss_store_sk = s_store_sk
                     AND d_month_seq BETWEEN 1212 AND 1212 + 11) y,
                  (SELECT s_store_name s_store_name2,
                          wss.d_week_seq d_week_seq2,
                          s_store_id s_store_id2,
                          sun_sales sun_sales2,
                          mon_sales mon_sales2,
                          tue_sales tue_sales2,
                          wed_sales wed_sales2,
                          thu_sales thu_sales2,
                          fri_sales fri_sales2,
                          sat_sales sat_sales2
                   FROM wss,
                        store,
                        date_dim d
                   WHERE d.d_week_seq = wss.d_week_seq
                     AND ss_store_sk = s_store_sk
                     AND d_month_seq BETWEEN 1212 + 12 AND 1212 + 23) x
                WHERE s_store_id1=s_store_id2
                  AND d_week_seq1=d_week_seq2-52
                ORDER BY s_store_name1,
                         s_store_id1,
                         d_week_seq1
                LIMIT 100;
                
