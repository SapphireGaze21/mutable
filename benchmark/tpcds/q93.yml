description: TPC-DS Query 93
suite: TPC
benchmark: TPC-DS
name: Q93
readonly: true
data:
    Reason:
        file: benchmark/tpcds/data/reason.csv
        lines_in_file: 36
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'r_reason_sk': 'INT NOT NULL'
            'r_reason_id': 'CHAR 16 NOT NULL'
            'r_reason_desc': 'CHAR 100'
    StoreReturns:
        file: benchmark/tpcds/data/store_returns.csv
        lines_in_file: 287868
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'sr_returned_date_sk': 'INT'
            'sr_return_time_sk': 'INT'
            'sr_item_sk': 'INT NOT NULL'
            'sr_customer_sk': 'INT'
            'sr_cdemo_sk': 'INT'
            'sr_hdemo_sk': 'INT'
            'sr_addr_sk': 'INT'
            'sr_store_sk': 'INT'
            'sr_reason_sk': 'INT'
            'sr_ticket_number': 'INT NOT NULL'
            'sr_return_quantity': 'INT'
            'sr_return_amt': 'DECIMAL 7 2'
            'sr_return_tax': 'DECIMAL 7 2'
            'sr_return_amt_inc_tax': 'DECIMAL 7 2'
            'sr_fee': 'DECIMAL 7 2'
            'sr_return_ship_cost': 'DECIMAL 7 2'
            'sr_refunded_cash': 'DECIMAL 7 2'
            'sr_reversed_charge': 'DECIMAL 7 2'
            'sr_store_credit': 'DECIMAL 7 2'
            'sr_net_loss': 'DECIMAL 7 2'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT ss_customer_sk,
                       sum(act_sales) sumsales
                FROM
                  (SELECT ss_item_sk,
                          ss_ticket_number,
                          ss_customer_sk,
                          CASE
                              WHEN sr_return_quantity IS NOT NULL THEN (ss_quantity-sr_return_quantity)*ss_sales_price
                              ELSE (ss_quantity*ss_sales_price)
                          END act_sales
                   FROM store_sales
                   LEFT OUTER JOIN store_returns ON (sr_item_sk = ss_item_sk
                                                     AND sr_ticket_number = ss_ticket_number) ,reason
                   WHERE sr_reason_sk = r_reason_sk
                     AND r_reason_desc = 'reason 28') t
                GROUP BY ss_customer_sk
                ORDER BY sumsales,
                         ss_customer_sk
                LIMIT 100;
                
    PostgreSQL:
        cases:
            1: |
                SELECT ss_customer_sk,
                       sum(act_sales) sumsales
                FROM
                  (SELECT ss_item_sk,
                          ss_ticket_number,
                          ss_customer_sk,
                          CASE
                              WHEN sr_return_quantity IS NOT NULL THEN (ss_quantity-sr_return_quantity)*ss_sales_price
                              ELSE (ss_quantity*ss_sales_price)
                          END act_sales
                   FROM store_sales
                   LEFT OUTER JOIN store_returns ON (sr_item_sk = ss_item_sk
                                                     AND sr_ticket_number = ss_ticket_number) ,reason
                   WHERE sr_reason_sk = r_reason_sk
                     AND r_reason_desc = 'reason 28') t
                GROUP BY ss_customer_sk
                ORDER BY sumsales,
                         ss_customer_sk
                LIMIT 100;
                
    DuckDB:
        cases:
            1: |
                SELECT ss_customer_sk,
                       sum(act_sales) sumsales
                FROM
                  (SELECT ss_item_sk,
                          ss_ticket_number,
                          ss_customer_sk,
                          CASE
                              WHEN sr_return_quantity IS NOT NULL THEN (ss_quantity-sr_return_quantity)*ss_sales_price
                              ELSE (ss_quantity*ss_sales_price)
                          END act_sales
                   FROM store_sales
                   LEFT OUTER JOIN store_returns ON (sr_item_sk = ss_item_sk
                                                     AND sr_ticket_number = ss_ticket_number) ,reason
                   WHERE sr_reason_sk = r_reason_sk
                     AND r_reason_desc = 'reason 28') t
                GROUP BY ss_customer_sk
                ORDER BY sumsales,
                         ss_customer_sk
                LIMIT 100;
                
    HyPer:
        cases:
            1: |
                SELECT ss_customer_sk,
                       sum(act_sales) sumsales
                FROM
                  (SELECT ss_item_sk,
                          ss_ticket_number,
                          ss_customer_sk,
                          CASE
                              WHEN sr_return_quantity IS NOT NULL THEN (ss_quantity-sr_return_quantity)*ss_sales_price
                              ELSE (ss_quantity*ss_sales_price)
                          END act_sales
                   FROM store_sales
                   LEFT OUTER JOIN store_returns ON (sr_item_sk = ss_item_sk
                                                     AND sr_ticket_number = ss_ticket_number) ,reason
                   WHERE sr_reason_sk = r_reason_sk
                     AND r_reason_desc = 'reason 28') t
                GROUP BY ss_customer_sk
                ORDER BY sumsales,
                         ss_customer_sk
                LIMIT 100;
                
