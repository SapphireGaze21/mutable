description: TPC-DS Query 31
suite: TPC
benchmark: TPC-DS
name: Q31
readonly: true
data:
    CustomerAddress:
        file: benchmark/tpcds/data/customer_address.csv
        lines_in_file: 50001
        format: 'CSV'
        delimiter: ','
        header: 1
