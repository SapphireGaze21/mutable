            'ss_net_profit': 'DECIMAL 7 2'
    WebSales:
        file: benchmark/tpcds/data/web_sales.csv
        lines_in_file: 719385
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ws_sold_date_sk': 'INT'
            'ws_sold_time_sk': 'INT'
            'ws_ship_date_sk': 'INT'
            'ws_item_sk': 'INT NOT NULL'
            'ws_bill_customer_sk': 'INT'
            'ws_bill_cdemo_sk': 'INT'
            'ws_bill_hdemo_sk': 'INT'
            'ws_bill_addr_sk': 'INT'
            'ws_ship_customer_sk': 'INT'
            'ws_ship_cdemo_sk': 'INT'
            'ws_ship_hdemo_sk': 'INT'
            'ws_ship_addr_sk': 'INT'
            'ws_web_page_sk': 'INT'
            'ws_web_site_sk': 'INT'
            'ws_ship_mode_sk': 'INT'
            'ws_warehouse_sk': 'INT'
            'ws_promo_sk': 'INT'
            'ws_order_number': 'INT NOT NULL'
            'ws_quantity': 'INT'
            'ws_wholesale_cost': 'DECIMAL 7 2'
            'ws_list_price': 'DECIMAL 7 2'
            'ws_sales_price': 'DECIMAL 7 2'
            'ws_ext_discount_amt': 'DECIMAL 7 2'
            'ws_ext_sales_price': 'DECIMAL 7 2'
            'ws_ext_wholesale_cost': 'DECIMAL 7 2'
            'ws_ext_list_price': 'DECIMAL 7 2'
            'ws_ext_tax': 'DECIMAL 7 2'
            'ws_coupon_amt': 'DECIMAL 7 2'
            'ws_ext_ship_cost': 'DECIMAL 7 2'
            'ws_net_paid': 'DECIMAL 7 2'
            'ws_net_paid_inc_tax': 'DECIMAL 7 2'
            'ws_net_paid_inc_ship': 'DECIMAL 7 2'
            'ws_net_paid_inc_ship_tax': 'DECIMAL 7 2'
            'ws_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                WITH ss AS
                  (SELECT ca_county,
                          d_qoy,
                          d_year,
                          sum(ss_ext_sales_price) AS store_sales
                   FROM store_sales,
                        date_dim,
                        customer_address
                   WHERE ss_sold_date_sk = d_date_sk
                     AND ss_addr_sk=ca_address_sk
                   GROUP BY ca_county,
                            d_qoy,
                            d_year),
                     ws AS
                  (SELECT ca_county,
                          d_qoy,
                          d_year,
                          sum(ws_ext_sales_price) AS web_sales
                   FROM web_sales,
                        date_dim,
                        customer_address
                   WHERE ws_sold_date_sk = d_date_sk
                     AND ws_bill_addr_sk=ca_address_sk
                   GROUP BY ca_county,
                            d_qoy,
                            d_year)
                SELECT ss1.ca_county ,
                       ss1.d_year ,
                       (ws2.web_sales*1.0000)/ws1.web_sales web_q1_q2_increase ,
                       (ss2.store_sales*1.0000)/ss1.store_sales store_q1_q2_increase ,
                       (ws3.web_sales*1.0000)/ws2.web_sales web_q2_q3_increase ,
                       (ss3.store_sales*1.0000)/ss2.store_sales store_q2_q3_increase
                FROM ss ss1 ,
                     ss ss2 ,
                     ss ss3 ,
                     ws ws1 ,
                     ws ws2 ,
                     ws ws3
                WHERE ss1.d_qoy = 1
                  AND ss1.d_year = 2000
                  AND ss1.ca_county = ss2.ca_county
                  AND ss2.d_qoy = 2
                  AND ss2.d_year = 2000
                  AND ss2.ca_county = ss3.ca_county
                  AND ss3.d_qoy = 3
                  AND ss3.d_year = 2000
                  AND ss1.ca_county = ws1.ca_county
                  AND ws1.d_qoy = 1
                  AND ws1.d_year = 2000
                  AND ws1.ca_county = ws2.ca_county
                  AND ws2.d_qoy = 2
                  AND ws2.d_year = 2000
                  AND ws1.ca_county = ws3.ca_county
                  AND ws3.d_qoy = 3
                  AND ws3.d_year = 2000
                  AND CASE
                          WHEN ws1.web_sales > 0 THEN (ws2.web_sales*1.0000)/ws1.web_sales
                          ELSE NULL
                      END > CASE
                                WHEN ss1.store_sales > 0 THEN (ss2.store_sales*1.0000)/ss1.store_sales
                                ELSE NULL
                            END
                  AND CASE
                          WHEN ws2.web_sales > 0 THEN (ws3.web_sales*1.0000)/ws2.web_sales
                          ELSE NULL
                      END > CASE
                                WHEN ss2.store_sales > 0 THEN (ss3.store_sales*1.0000)/ss2.store_sales
                                ELSE NULL
                            END
                ORDER BY ss1.ca_county;
                
