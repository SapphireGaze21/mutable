description: TPC-DS Query 06
suite: TPC
benchmark: TPC-DS
name: Q06
readonly: true
data:
    Customer:
        file: benchmark/tpcds/data/customer.csv
        lines_in_file: 100001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'c_customer_sk': 'INT NOT NULL'
            'c_customer_id': 'CHAR 16 NOT NULL'
            'c_current_cdemo_sk': 'INT'
            'c_current_hdemo_sk': 'INT'
            'c_current_addr_sk': 'INT'
            'c_first_shipto_date_sk': 'INT'
            'c_first_sales_date_sk': 'INT'
            'c_salutation': 'CHAR 10'
            'c_first_name': 'CHAR 20'
            'c_last_name': 'CHAR 30'
            'c_preferred_cust_flag': 'CHAR 1'
            'c_birth_day': 'INT'
            'c_birth_month': 'INT'
            'c_birth_year': 'INT'
            'c_birth_country': 'CHAR 20'
            'c_login': 'CHAR 13'
            'c_email_address': 'CHAR 50'
            'c_last_review_date_sk': 'INT'
    CustomerAddress:
        file: benchmark/tpcds/data/customer_address.csv
        lines_in_file: 50001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ca_address_sk': 'INT NOT NULL'
            'ca_address_id': 'CHAR 16 NOT NULL'
            'ca_street_number': 'CHAR 10'
            'ca_street_name': 'CHAR 60'
            'ca_street_type': 'CHAR 15'
            'ca_suite_number': 'CHAR 10'
            'ca_city': 'CHAR 60'
            'ca_county': 'CHAR 30'
            'ca_state': 'CHAR 2'
            'ca_zip': 'CHAR 10'
            'ca_country': 'CHAR 20'
            'ca_gmt_offset': 'DECIMAL 5 2'
            'ca_location_type': 'CHAR 20'
    DateDim:
        file: benchmark/tpcds/data/date_dim.csv
        lines_in_file: 73050
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'd_date_sk': 'INT NOT NULL'
            'd_date_id': 'CHAR 16 NOT NULL'
            'd_date': 'DATE'
            'd_month_seq': 'INT'
            'd_week_seq': 'INT'
            'd_quarter_seq': 'INT'
            'd_year': 'INT'
            'd_dow': 'INT'
            'd_moy': 'INT'
            'd_dom': 'INT'
            'd_qoy': 'INT'
            'd_fy_year': 'INT'
            'd_fy_quarter_seq': 'INT'
            'd_fy_week_seq': 'INT'
            'd_day_name': 'CHAR 9'
            'd_quarter_name': 'CHAR 6'
            'd_holiday': 'CHAR 1'
            'd_weekend': 'CHAR 1'
            'd_following_holiday': 'CHAR 1'
            'd_first_dom': 'INT'
            'd_last_dom': 'INT'
            'd_same_day_ly': 'INT'
            'd_same_day_lq': 'INT'
            'd_current_day': 'CHAR 1'
            'd_current_week': 'CHAR 1'
            'd_current_month': 'CHAR 1'
            'd_current_quarter': 'CHAR 1'
            'd_current_year': 'CHAR 1'
    Item:
        file: benchmark/tpcds/data/item.csv
        lines_in_file: 18001
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'i_item_sk': 'INT NOT NULL'
            'i_item_id': 'CHAR 16 NOT NULL'
            'i_rec_start_date': 'DATE'
            'i_rec_end_date': 'DATE'
            'i_item_desc': 'CHAR 200'
            'i_current_price': 'DECIMAL 7 2'
            'i_wholesale_cost': 'DECIMAL 7 2'
            'i_brand_id': 'INT'
            'i_brand': 'CHAR 50'
            'i_class_id': 'INT'
            'i_class': 'CHAR 50'
            'i_category_id': 'INT'
            'i_category': 'CHAR 50'
            'i_manufact_id': 'INT'
            'i_manufact': 'CHAR 50'
            'i_size': 'CHAR 20'
            'i_formulation': 'CHAR 20'
            'i_color': 'CHAR 20'
            'i_units': 'CHAR 10'
            'i_container': 'CHAR 10'
            'i_manager_id': 'INT'
            'i_product_name': 'CHAR 50'
    StoreSales:
        file: benchmark/tpcds/data/store_sales.csv
        lines_in_file: 2880405
        format: 'CSV'
        delimiter: ','
        header: 1
        attributes:
            'ss_sold_date_sk': 'INT'
            'ss_sold_time_sk': 'INT'
            'ss_item_sk': 'INT NOT NULL'
            'ss_customer_sk': 'INT'
            'ss_cdemo_sk': 'INT'
            'ss_hdemo_sk': 'INT'
            'ss_addr_sk': 'INT'
            'ss_store_sk': 'INT'
            'ss_promo_sk': 'INT'
            'ss_ticket_number': 'INT NOT NULL'
            'ss_quantity': 'INT'
            'ss_wholesale_cost': 'DECIMAL 7 2'
            'ss_list_price': 'DECIMAL 7 2'
            'ss_sales_price': 'DECIMAL 7 2'
            'ss_ext_discount_amt': 'DECIMAL 7 2'
            'ss_ext_sales_price': 'DECIMAL 7 2'
            'ss_ext_wholesale_cost': 'DECIMAL 7 2'
            'ss_ext_list_price': 'DECIMAL 7 2'
            'ss_ext_tax': 'DECIMAL 7 2'
            'ss_coupon_amt': 'DECIMAL 7 2'
            'ss_net_paid': 'DECIMAL 7 2'
            'ss_net_paid_inc_tax': 'DECIMAL 7 2'
            'ss_net_profit': 'DECIMAL 7 2'
systems:
    mutable:
        configurations:
            'WasmV8, PAX4M':
                args: >-
                    --backend WasmV8
                    --data-layout PAX4M
                pattern: '^Execute machine code:.*'
        cases:
            1: |
                SELECT a.ca_state state,
                       count(*) cnt
                FROM customer_address a ,
                     customer c ,
                     store_sales s ,
                     date_dim d ,
                     item i
                WHERE a.ca_address_sk = c.c_current_addr_sk
                  AND c.c_customer_sk = s.ss_customer_sk
                  AND s.ss_sold_date_sk = d.d_date_sk
                  AND s.ss_item_sk = i.i_item_sk
                  AND d.d_month_seq =
                    (SELECT DISTINCT (d_month_seq)
                     FROM date_dim
                     WHERE d_year = 2001
                       AND d_moy = 1 )
                  AND i.i_current_price > 1.2 *
                    (SELECT avg(j.i_current_price)
                     FROM item j
                     WHERE j.i_category = i.i_category)
                GROUP BY a.ca_state
                HAVING count(*) >= 10
                ORDER BY cnt,
                         a.ca_state
                LIMIT 100;
                
