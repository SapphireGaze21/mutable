description: Join Order Benchmark Query 11
suite: job
benchmark: q11
readonly: true
data:
  company_name:
    file: benchmark/job/data/company_name.csv
    lines_in_file: 234997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      country_code: CHAR 6
      imdb_id: INT
      name_pcode_nf: CHAR 5
      name_pcode_sf: CHAR 5
      md5sum: CHAR 32
  company_type:
    file: benchmark/job/data/company_type.csv
    lines_in_file: 4
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      kind: CHAR 32
  keyword:
    file: benchmark/job/data/keyword.csv
    lines_in_file: 134170
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      keyword: CHAR 100 NOT NULL
      phonetic_code: CHAR 5
  link_type:
    file: benchmark/job/data/link_type.csv
    lines_in_file: 18
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      link: CHAR 32 NOT NULL
  movie_companies:
    file: benchmark/job/data/movie_companies.csv
    lines_in_file: 2609129
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      company_id: INT NOT NULL
      company_type_id: INT NOT NULL
      note: CHAR 100
  movie_keyword:
    file: benchmark/job/data/movie_keyword.csv
    lines_in_file: 4523930
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      keyword_id: INT NOT NULL
  movie_link:
    file: benchmark/job/data/movie_link.csv
    lines_in_file: 29997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      linked_movie_id: INT NOT NULL
      link_type_id: INT NOT NULL
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT cn.name AS from_company,\n       lt.link AS movie_link_type,\n  \
        \     t.title AS non_polish_sequel_movie\nFROM company_name AS cn,\n     company_type\
        \ AS ct,\n     keyword AS k,\n     link_type AS lt,\n     movie_companies\
        \ AS mc,\n     movie_keyword AS mk,\n     movie_link AS ml,\n     title AS\
        \ t\nWHERE cn.country_code != \"[pl]\"\n  AND (cn.name LIKE \"%Film%\"\n \
        \      OR cn.name LIKE \"%Warner%\")\n  AND ct.kind = \"production companies\"\
        \n  AND k.keyword = \"sequel\"\n  AND lt.link LIKE \"%follow%\"\n  AND mc.note\
        \ = \"\"\n  AND (t.production_year >= 1950 AND t.production_year <= 2000)\n\
        \  AND lt.id = ml.link_type_id\n  AND ml.movie_id = t.id\n  AND t.id = mk.movie_id\n\
        \  AND mk.keyword_id = k.id\n  AND t.id = mc.movie_id\n  AND mc.company_type_id\
        \ = ct.id\n  AND mc.company_id = cn.id\n  AND ml.movie_id = mk.movie_id\n\
        \  AND ml.movie_id = mc.movie_id\n  AND mk.movie_id = mc.movie_id;"
      b: "SELECT cn.name AS from_company,\n       lt.link AS movie_link_type,\n  \
        \     t.title AS sequel_movie\nFROM company_name AS cn,\n     company_type\
        \ AS ct,\n     keyword AS k,\n     link_type AS lt,\n     movie_companies\
        \ AS mc,\n     movie_keyword AS mk,\n     movie_link AS ml,\n     title AS\
        \ t\nWHERE cn.country_code != \"[pl]\"\n  AND (cn.name LIKE \"%Film%\"\n \
        \      OR cn.name LIKE \"%Warner%\")\n  AND ct.kind = \"production companies\"\
        \n  AND k.keyword = \"sequel\"\n  AND lt.link LIKE \"%follows%\"\n  AND mc.note\
        \ = \"\"\n  AND t.production_year = 1998\n  AND t.title LIKE \"%Money%\"\n\
        \  AND lt.id = ml.link_type_id\n  AND ml.movie_id = t.id\n  AND t.id = mk.movie_id\n\
        \  AND mk.keyword_id = k.id\n  AND t.id = mc.movie_id\n  AND mc.company_type_id\
        \ = ct.id\n  AND mc.company_id = cn.id\n  AND ml.movie_id = mk.movie_id\n\
        \  AND ml.movie_id = mc.movie_id\n  AND mk.movie_id = mc.movie_id;"
      c: "SELECT cn.name AS from_company,\n       mc.note AS production_note,\n  \
        \     t.title AS movie_based_on_book\nFROM company_name AS cn,\n     company_type\
        \ AS ct,\n     keyword AS k,\n     link_type AS lt,\n     movie_companies\
        \ AS mc,\n     movie_keyword AS mk,\n     movie_link AS ml,\n     title AS\
        \ t\nWHERE cn.country_code != \"[pl]\"\n  AND (cn.name LIKE \"20th Century\
        \ Fox%\"\n       OR cn.name LIKE \"Twentieth Century Fox%\")\n  AND ct.kind\
        \ != \"production companies\"\n  AND ct.kind != \"\"\n  AND (k.keyword = \"\
        sequel\" OR k.keyword = \"revenge\" OR k.keyword = \"based-on-novel\")\n \
        \ AND mc.note != \"\"\n  AND t.production_year > 1950\n  AND lt.id = ml.link_type_id\n\
        \  AND ml.movie_id = t.id\n  AND t.id = mk.movie_id\n  AND mk.keyword_id =\
        \ k.id\n  AND t.id = mc.movie_id\n  AND mc.company_type_id = ct.id\n  AND\
        \ mc.company_id = cn.id\n  AND ml.movie_id = mk.movie_id\n  AND ml.movie_id\
        \ = mc.movie_id\n  AND mk.movie_id = mc.movie_id;"
      d: "SELECT cn.name AS from_company,\n       mc.note AS production_note,\n  \
        \     t.title AS movie_based_on_book\nFROM company_name AS cn,\n     company_type\
        \ AS ct,\n     keyword AS k,\n     link_type AS lt,\n     movie_companies\
        \ AS mc,\n     movie_keyword AS mk,\n     movie_link AS ml,\n     title AS\
        \ t\nWHERE cn.country_code != \"[pl]\"\n  AND ct.kind != \"production companies\"\
        \n  AND ct.kind != \"\"\n  AND (k.keyword = \"sequel\" OR k.keyword = \"revenge\"\
        \ OR k.keyword = \"based-on-novel\")\n  AND mc.note != \"\"\n  AND t.production_year\
        \ > 1950\n  AND lt.id = ml.link_type_id\n  AND ml.movie_id = t.id\n  AND t.id\
        \ = mk.movie_id\n  AND mk.keyword_id = k.id\n  AND t.id = mc.movie_id\n  AND\
        \ mc.company_type_id = ct.id\n  AND mc.company_id = cn.id\n  AND ml.movie_id\
        \ = mk.movie_id\n  AND ml.movie_id = mc.movie_id\n  AND mk.movie_id = mc.movie_id;"
