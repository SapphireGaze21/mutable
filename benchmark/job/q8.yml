description: Join Order Benchmark Query 8
suite: job
benchmark: q8
readonly: true
data:
  aka_name:
    file: benchmark/job/data/aka_name.csv
    lines_in_file: 901343
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      name: CHAR 100
      imdb_index: CHAR 3
      name_pcode_cf: CHAR 11
      name_pcode_nf: CHAR 11
      surname_pcode: CHAR 11
      md5sum: CHAR 65
  cast_info:
    file: benchmark/job/data/cast_info.csv
    lines_in_file: 36244344
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      movie_id: INT NOT NULL
      person_role_id: INT
      note: CHAR 100
      nr_order: INT
      role_id: INT NOT NULL
  company_name:
    file: benchmark/job/data/company_name.csv
    lines_in_file: 234997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      country_code: CHAR 6
      imdb_id: INT
      name_pcode_nf: CHAR 5
      name_pcode_sf: CHAR 5
      md5sum: CHAR 32
  movie_companies:
    file: benchmark/job/data/movie_companies.csv
    lines_in_file: 2609129
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      company_id: INT NOT NULL
      company_type_id: INT NOT NULL
      note: CHAR 100
  name:
    file: benchmark/job/data/name.csv
    lines_in_file: 4167491
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      imdb_index: CHAR 9
      imdb_id: INT
      gender: CHAR 1
      name_pcode_cf: CHAR 5
      name_pcode_nf: CHAR 5
      surname_pcode: CHAR 5
      md5sum: CHAR 32
  role_type:
    file: benchmark/job/data/role_type.csv
    lines_in_file: 12
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      role: CHAR 32 NOT NULL
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT an1.name AS actress_pseudonym,\n       t.title AS japanese_movie_dubbed\n\
        FROM aka_name AS an1,\n     cast_info AS ci,\n     company_name AS cn,\n \
        \    movie_companies AS mc,\n     name AS n1,\n     role_type AS rt,\n   \
        \  title AS t\nWHERE ci.note = \"(voice: English version)\"\n  AND cn.country_code\
        \ = \"[jp]\"\n  AND mc.note LIKE \"%(Japan)%\"\n  AND NOT (mc.note LIKE \"\
        %(USA)%\")\n  AND n1.name LIKE \"%Yo%\"\n  AND NOT (n1.name LIKE \"%Yu%\"\
        )\n  AND rt.role = \"actress\"\n  AND an1.person_id = n1.id\n  AND n1.id =\
        \ ci.person_id\n  AND ci.movie_id = t.id\n  AND t.id = mc.movie_id\n  AND\
        \ mc.company_id = cn.id\n  AND ci.role_id = rt.id\n  AND an1.person_id = ci.person_id\n\
        \  AND ci.movie_id = mc.movie_id;"
      b: "SELECT an.name AS acress_pseudonym,\n       t.title AS japanese_anime_movie\n\
        FROM aka_name AS an,\n     cast_info AS ci,\n     company_name AS cn,\n  \
        \   movie_companies AS mc,\n     name AS n,\n     role_type AS rt,\n     title\
        \ AS t\nWHERE ci.note = \"(voice: English version)\"\n  AND cn.country_code\
        \ = \"[jp]\"\n  AND mc.note LIKE \"%(Japan)%\"\n  AND NOT (mc.note LIKE \"\
        %(USA)%\")\n  AND (mc.note LIKE \"%(2006)%\"\n       OR mc.note LIKE \"%(2007)%\"\
        )\n  AND n.name LIKE \"%Yo%\"\n  AND NOT (n.name LIKE \"%Yu%\")\n  AND rt.role\
        \ = \"actress\"\n  AND (t.production_year >= 2006 AND t.production_year <=\
        \ 2007)\n  AND (t.title LIKE \"One Piece%\"\n       OR t.title LIKE \"Dragon\
        \ Ball Z%\")\n  AND an.person_id = n.id\n  AND n.id = ci.person_id\n  AND\
        \ ci.movie_id = t.id\n  AND t.id = mc.movie_id\n  AND mc.company_id = cn.id\n\
        \  AND ci.role_id = rt.id\n  AND an.person_id = ci.person_id\n  AND ci.movie_id\
        \ = mc.movie_id;"
      c: "SELECT a1.name AS writer_pseudo_name,\n       t.title AS movie_title\nFROM\
        \ aka_name AS a1,\n     cast_info AS ci,\n     company_name AS cn,\n     movie_companies\
        \ AS mc,\n     name AS n1,\n     role_type AS rt,\n     title AS t\nWHERE\
        \ cn.country_code = \"[us]\"\n  AND rt.role = \"writer\"\n  AND a1.person_id\
        \ = n1.id\n  AND n1.id = ci.person_id\n  AND ci.movie_id = t.id\n  AND t.id\
        \ = mc.movie_id\n  AND mc.company_id = cn.id\n  AND ci.role_id = rt.id\n \
        \ AND a1.person_id = ci.person_id\n  AND ci.movie_id = mc.movie_id;"
      d: "SELECT an1.name AS costume_designer_pseudo,\n       t.title AS movie_with_costumes\n\
        FROM aka_name AS an1,\n     cast_info AS ci,\n     company_name AS cn,\n \
        \    movie_companies AS mc,\n     name AS n1,\n     role_type AS rt,\n   \
        \  title AS t\nWHERE cn.country_code = \"[us]\"\n  AND rt.role = \"costume\
        \ designer\"\n  AND an1.person_id = n1.id\n  AND n1.id = ci.person_id\n  AND\
        \ ci.movie_id = t.id\n  AND t.id = mc.movie_id\n  AND mc.company_id = cn.id\n\
        \  AND ci.role_id = rt.id\n  AND an1.person_id = ci.person_id\n  AND ci.movie_id\
        \ = mc.movie_id;"
