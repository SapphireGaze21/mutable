description: Join Order Benchmark Query 18
suite: job
benchmark: q18
readonly: true
data:
  cast_info:
    file: benchmark/job/data/cast_info.csv
    lines_in_file: 36244344
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      movie_id: INT NOT NULL
      person_role_id: INT
      note: CHAR 100
      nr_order: INT
      role_id: INT NOT NULL
  info_type:
    file: benchmark/job/data/info_type.csv
    lines_in_file: 113
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      info: CHAR 32 NOT NULL
  movie_info:
    file: benchmark/job/data/movie_info.csv
    lines_in_file: 14835720
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      info_type_id: INT NOT NULL
      info: CHAR 100 NOT NULL
      note: CHAR 100
  movie_info_idx:
    file: benchmark/job/data/movie_info_idx.csv
    lines_in_file: 1380035
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      info_type_id: INT NOT NULL
      info: CHAR 100 NOT NULL
      note: CHAR 1
  name:
    file: benchmark/job/data/name.csv
    lines_in_file: 4167491
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      imdb_index: CHAR 9
      imdb_id: INT
      gender: CHAR 1
      name_pcode_cf: CHAR 5
      name_pcode_nf: CHAR 5
      surname_pcode: CHAR 5
      md5sum: CHAR 32
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT mi.info AS movie_budget,\n       mi_idx.info AS movie_votes,\n  \
        \     t.title AS movie_title\nFROM cast_info AS ci,\n     info_type AS it1,\n\
        \     info_type AS it2,\n     movie_info AS mi,\n     movie_info_idx AS mi_idx,\n\
        \     name AS n,\n     title AS t\nWHERE (ci.note = \"(producer)\" OR ci.note\
        \ = \"(executive producer)\")\n  AND it1.info = \"budget\"\n  AND it2.info\
        \ = \"votes\"\n  AND n.gender = \"m\"\n  AND n.name LIKE \"%Tim%\"\n  AND\
        \ t.id = mi.movie_id\n  AND t.id = mi_idx.movie_id\n  AND t.id = ci.movie_id\n\
        \  AND ci.movie_id = mi.movie_id\n  AND ci.movie_id = mi_idx.movie_id\n  AND\
        \ mi.movie_id = mi_idx.movie_id\n  AND n.id = ci.person_id\n  AND it1.id =\
        \ mi.info_type_id\n  AND it2.id = mi_idx.info_type_id;"
      b: "SELECT mi.info AS movie_budget,\n       mi_idx.info AS movie_votes,\n  \
        \     t.title AS movie_title\nFROM cast_info AS ci,\n     info_type AS it1,\n\
        \     info_type AS it2,\n     movie_info AS mi,\n     movie_info_idx AS mi_idx,\n\
        \     name AS n,\n     title AS t\nWHERE (ci.note = \"(writer)\" OR ci.note\
        \ = \"(head writer)\" OR ci.note = \"(written by)\" OR ci.note = \"(story)\"\
        \ OR ci.note = \"(story editor)\")\n  AND it1.info = \"genres\"\n  AND it2.info\
        \ = \"rating\"\n  AND (mi.info = \"Horror\" OR mi.info = \"Thriller\")\n \
        \ AND mi.note = \"\"\n  AND mi_idx.info > \"8.0\"\n  AND n.gender != \"\"\n\
        \  AND n.gender = \"f\"\n  AND (t.production_year >= 2008 AND t.production_year\
        \ <= 2014)\n  AND t.id = mi.movie_id\n  AND t.id = mi_idx.movie_id\n  AND\
        \ t.id = ci.movie_id\n  AND ci.movie_id = mi.movie_id\n  AND ci.movie_id =\
        \ mi_idx.movie_id\n  AND mi.movie_id = mi_idx.movie_id\n  AND n.id = ci.person_id\n\
        \  AND it1.id = mi.info_type_id\n  AND it2.id = mi_idx.info_type_id;"
      c: "SELECT mi.info AS movie_budget,\n       mi_idx.info AS movie_votes,\n  \
        \     t.title AS movie_title\nFROM cast_info AS ci,\n     info_type AS it1,\n\
        \     info_type AS it2,\n     movie_info AS mi,\n     movie_info_idx AS mi_idx,\n\
        \     name AS n,\n     title AS t\nWHERE (ci.note = \"(writer)\" OR ci.note\
        \ = \"(head writer)\" OR ci.note = \"(written by)\" OR ci.note = \"(story)\"\
        \ OR ci.note = \"(story editor)\")\n  AND it1.info = \"genres\"\n  AND it2.info\
        \ = \"votes\"\n  AND (mi.info = \"Horror\" OR mi.info = \"Action\" OR mi.info\
        \ = \"Sci-Fi\" OR mi.info = \"Thriller\" OR mi.info = \"Crime\" OR mi.info\
        \ = \"War\")\n  AND n.gender = \"m\"\n  AND t.id = mi.movie_id\n  AND t.id\
        \ = mi_idx.movie_id\n  AND t.id = ci.movie_id\n  AND ci.movie_id = mi.movie_id\n\
        \  AND ci.movie_id = mi_idx.movie_id\n  AND mi.movie_id = mi_idx.movie_id\n\
        \  AND n.id = ci.person_id\n  AND it1.id = mi.info_type_id\n  AND it2.id =\
        \ mi_idx.info_type_id;"
