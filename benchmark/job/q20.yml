      md5sum: CHAR 32
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT t.title AS complete_downey_ironman_movie\nFROM complete_cast AS cc,\n\
        \     comp_cast_type AS cct1,\n     comp_cast_type AS cct2,\n     char_name\
        \ AS chn,\n     cast_info AS ci,\n     keyword AS k,\n     kind_type AS kt,\n\
        \     movie_keyword AS mk,\n     name AS n,\n     title AS t\nWHERE cct1.kind\
        \ = \"cast\"\n  AND cct2.kind LIKE \"%complete%\"\n  AND NOT (chn.name LIKE\
        \ \"%Sherlock%\")\n  AND (chn.name LIKE \"%Tony%Stark%\"\n       OR chn.name\
        \ LIKE \"%Iron%Man%\")\n  AND (k.keyword = \"superhero\" OR k.keyword = \"\
        sequel\" OR k.keyword = \"second-part\" OR k.keyword = \"marvel-comics\" OR\
        \ k.keyword = \"based-on-comic\" OR k.keyword = \"tv-special\" OR k.keyword\
        \ = \"fight\" OR k.keyword = \"violence\")\n  AND kt.kind = \"movie\"\n  AND\
        \ t.production_year > 1950\n  AND kt.id = t.kind_id\n  AND t.id = mk.movie_id\n\
        \  AND t.id = ci.movie_id\n  AND t.id = cc.movie_id\n  AND mk.movie_id = ci.movie_id\n\
        \  AND mk.movie_id = cc.movie_id\n  AND ci.movie_id = cc.movie_id\n  AND chn.id\
        \ = ci.person_role_id\n  AND n.id = ci.person_id\n  AND k.id = mk.keyword_id\n\
        \  AND cct1.id = cc.subject_id\n  AND cct2.id = cc.status_id;"
      b: "SELECT t.title AS complete_downey_ironman_movie\nFROM complete_cast AS cc,\n\
        \     comp_cast_type AS cct1,\n     comp_cast_type AS cct2,\n     char_name\
        \ AS chn,\n     cast_info AS ci,\n     keyword AS k,\n     kind_type AS kt,\n\
        \     movie_keyword AS mk,\n     name AS n,\n     title AS t\nWHERE cct1.kind\
        \ = \"cast\"\n  AND cct2.kind LIKE \"%complete%\"\n  AND NOT (chn.name LIKE\
        \ \"%Sherlock%\")\n  AND (chn.name LIKE \"%Tony%Stark%\"\n       OR chn.name\
        \ LIKE \"%Iron%Man%\")\n  AND (k.keyword = \"superhero\" OR k.keyword = \"\
        sequel\" OR k.keyword = \"second-part\" OR k.keyword = \"marvel-comics\" OR\
        \ k.keyword = \"based-on-comic\" OR k.keyword = \"tv-special\" OR k.keyword\
        \ = \"fight\" OR k.keyword = \"violence\")\n  AND kt.kind = \"movie\"\n  AND\
        \ n.name LIKE \"%Downey%Robert%\"\n  AND t.production_year > 2000\n  AND kt.id\
        \ = t.kind_id\n  AND t.id = mk.movie_id\n  AND t.id = ci.movie_id\n  AND t.id\
        \ = cc.movie_id\n  AND mk.movie_id = ci.movie_id\n  AND mk.movie_id = cc.movie_id\n\
        \  AND ci.movie_id = cc.movie_id\n  AND chn.id = ci.person_role_id\n  AND\
        \ n.id = ci.person_id\n  AND k.id = mk.keyword_id\n  AND cct1.id = cc.subject_id\n\
        \  AND cct2.id = cc.status_id;"
      c: "SELECT n.name AS cast_member,\n       t.title AS complete_dynamic_hero_movie\n\
        FROM complete_cast AS cc,\n     comp_cast_type AS cct1,\n     comp_cast_type\
        \ AS cct2,\n     char_name AS chn,\n     cast_info AS ci,\n     keyword AS\
        \ k,\n     kind_type AS kt,\n     movie_keyword AS mk,\n     name AS n,\n\
        \     title AS t\nWHERE cct1.kind = \"cast\"\n  AND cct2.kind LIKE \"%complete%\"\
        \n  AND chn.name != \"\"\n  AND (chn.name LIKE \"%man%\"\n       OR chn.name\
        \ LIKE \"%Man%\")\n  AND (k.keyword = \"superhero\" OR k.keyword = \"marvel-comics\"\
        \ OR k.keyword = \"based-on-comic\" OR k.keyword = \"tv-special\" OR k.keyword\
        \ = \"fight\" OR k.keyword = \"violence\" OR k.keyword = \"magnet\" OR k.keyword\
        \ = \"web\" OR k.keyword = \"claw\" OR k.keyword = \"laser\")\n  AND kt.kind\
        \ = \"movie\"\n  AND t.production_year > 2000\n  AND kt.id = t.kind_id\n \
        \ AND t.id = mk.movie_id\n  AND t.id = ci.movie_id\n  AND t.id = cc.movie_id\n\
        \  AND mk.movie_id = ci.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND ci.movie_id\
        \ = cc.movie_id\n  AND chn.id = ci.person_role_id\n  AND n.id = ci.person_id\n\
        \  AND k.id = mk.keyword_id\n  AND cct1.id = cc.subject_id\n  AND cct2.id\
        \ = cc.status_id;"
