description: Join Order Benchmark Query 20
suite: job
benchmark: q20
readonly: true
data:
  complete_cast:
    file: benchmark/job/data/complete_cast.csv
    lines_in_file: 135086
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT
      subject_id: INT NOT NULL
      status_id: INT NOT NULL
  comp_cast_type:
    file: benchmark/job/data/comp_cast_type.csv
    lines_in_file: 4
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      kind: CHAR 32 NOT NULL
  char_name:
    file: benchmark/job/data/char_name.csv
    lines_in_file: 3140339
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      imdb_index: CHAR 2
      imdb_id: INT
      name_pcode_nf: CHAR 5
      surname_pcode: CHAR 5
      md5sum: CHAR 32
  cast_info:
    file: benchmark/job/data/cast_info.csv
    lines_in_file: 36244344
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      movie_id: INT NOT NULL
      person_role_id: INT
      note: CHAR 100
      nr_order: INT
      role_id: INT NOT NULL
  keyword:
    file: benchmark/job/data/keyword.csv
    lines_in_file: 134170
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      keyword: CHAR 100 NOT NULL
      phonetic_code: CHAR 5
  kind_type:
    file: benchmark/job/data/kind_type.csv
    lines_in_file: 7
    format: csv
