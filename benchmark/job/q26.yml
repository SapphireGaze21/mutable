systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT chn.name AS character_name,\n       mi_idx.info AS rating,\n    \
        \   n.name AS playing_actor,\n       t.title AS complete_hero_movie\nFROM\
        \ complete_cast AS cc,\n     comp_cast_type AS cct1,\n     comp_cast_type\
        \ AS cct2,\n     char_name AS chn,\n     cast_info AS ci,\n     info_type\
        \ AS it2,\n     keyword AS k,\n     kind_type AS kt,\n     movie_info_idx\
        \ AS mi_idx,\n     movie_keyword AS mk,\n     name AS n,\n     title AS t\n\
        WHERE cct1.kind = \"cast\"\n  AND cct2.kind LIKE \"%complete%\"\n  AND chn.name\
        \ != \"\"\n  AND (chn.name LIKE \"%man%\"\n       OR chn.name LIKE \"%Man%\"\
        )\n  AND it2.info = \"rating\"\n  AND (k.keyword = \"superhero\" OR k.keyword\
        \ = \"marvel-comics\" OR k.keyword = \"based-on-comic\" OR k.keyword = \"\
        tv-special\" OR k.keyword = \"fight\" OR k.keyword = \"violence\" OR k.keyword\
        \ = \"magnet\" OR k.keyword = \"web\" OR k.keyword = \"claw\" OR k.keyword\
        \ = \"laser\")\n  AND kt.kind = \"movie\"\n  AND mi_idx.info > \"7.0\"\n \
        \ AND t.production_year > 2000\n  AND kt.id = t.kind_id\n  AND t.id = mk.movie_id\n\
        \  AND t.id = ci.movie_id\n  AND t.id = cc.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND mk.movie_id = ci.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND mk.movie_id\
        \ = mi_idx.movie_id\n  AND ci.movie_id = cc.movie_id\n  AND ci.movie_id =\
        \ mi_idx.movie_id\n  AND cc.movie_id = mi_idx.movie_id\n  AND chn.id = ci.person_role_id\n\
        \  AND n.id = ci.person_id\n  AND k.id = mk.keyword_id\n  AND cct1.id = cc.subject_id\n\
        \  AND cct2.id = cc.status_id\n  AND it2.id = mi_idx.info_type_id;"
      b: "SELECT chn.name AS character_name,\n       mi_idx.info AS rating,\n    \
        \   t.title AS complete_hero_movie\nFROM complete_cast AS cc,\n     comp_cast_type\
        \ AS cct1,\n     comp_cast_type AS cct2,\n     char_name AS chn,\n     cast_info\
        \ AS ci,\n     info_type AS it2,\n     keyword AS k,\n     kind_type AS kt,\n\
        \     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n     name AS n,\n\
        \     title AS t\nWHERE cct1.kind = \"cast\"\n  AND cct2.kind LIKE \"%complete%\"\
        \n  AND chn.name != \"\"\n  AND (chn.name LIKE \"%man%\"\n       OR chn.name\
        \ LIKE \"%Man%\")\n  AND it2.info = \"rating\"\n  AND (k.keyword = \"superhero\"\
        \ OR k.keyword = \"marvel-comics\" OR k.keyword = \"based-on-comic\" OR k.keyword\
        \ = \"fight\")\n  AND kt.kind = \"movie\"\n  AND mi_idx.info > \"8.0\"\n \
        \ AND t.production_year > 2005\n  AND kt.id = t.kind_id\n  AND t.id = mk.movie_id\n\
        \  AND t.id = ci.movie_id\n  AND t.id = cc.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND mk.movie_id = ci.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND mk.movie_id\
        \ = mi_idx.movie_id\n  AND ci.movie_id = cc.movie_id\n  AND ci.movie_id =\
        \ mi_idx.movie_id\n  AND cc.movie_id = mi_idx.movie_id\n  AND chn.id = ci.person_role_id\n\
        \  AND n.id = ci.person_id\n  AND k.id = mk.keyword_id\n  AND cct1.id = cc.subject_id\n\
        \  AND cct2.id = cc.status_id\n  AND it2.id = mi_idx.info_type_id;"
      c: "SELECT chn.name AS character_name,\n       mi_idx.info AS rating,\n    \
        \   t.title AS complete_hero_movie\nFROM complete_cast AS cc,\n     comp_cast_type\
        \ AS cct1,\n     comp_cast_type AS cct2,\n     char_name AS chn,\n     cast_info\
        \ AS ci,\n     info_type AS it2,\n     keyword AS k,\n     kind_type AS kt,\n\
        \     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n     name AS n,\n\
        \     title AS t\nWHERE cct1.kind = \"cast\"\n  AND cct2.kind LIKE \"%complete%\"\
        \n  AND chn.name != \"\"\n  AND (chn.name LIKE \"%man%\"\n       OR chn.name\
        \ LIKE \"%Man%\")\n  AND it2.info = \"rating\"\n  AND (k.keyword = \"superhero\"\
        \ OR k.keyword = \"marvel-comics\" OR k.keyword = \"based-on-comic\" OR k.keyword\
        \ = \"tv-special\" OR k.keyword = \"fight\" OR k.keyword = \"violence\" OR\
        \ k.keyword = \"magnet\" OR k.keyword = \"web\" OR k.keyword = \"claw\" OR\
        \ k.keyword = \"laser\")\n  AND kt.kind = \"movie\"\n  AND t.production_year\
        \ > 2000\n  AND kt.id = t.kind_id\n  AND t.id = mk.movie_id\n  AND t.id =\
        \ ci.movie_id\n  AND t.id = cc.movie_id\n  AND t.id = mi_idx.movie_id\n  AND\
        \ mk.movie_id = ci.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND mk.movie_id\
        \ = mi_idx.movie_id\n  AND ci.movie_id = cc.movie_id\n  AND ci.movie_id =\
        \ mi_idx.movie_id\n  AND cc.movie_id = mi_idx.movie_id\n  AND chn.id = ci.person_role_id\n\
        \  AND n.id = ci.person_id\n  AND k.id = mk.keyword_id\n  AND cct1.id = cc.subject_id\n\
        \  AND cct2.id = cc.status_id\n  AND it2.id = mi_idx.info_type_id;"
