description: Join Order Benchmark Query 10
suite: job
benchmark: q10
readonly: true
data:
  char_name:
    file: benchmark/job/data/char_name.csv
    lines_in_file: 3140339
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      imdb_index: CHAR 2
      imdb_id: INT
      name_pcode_nf: CHAR 5
      surname_pcode: CHAR 5
      md5sum: CHAR 32
  cast_info:
    file: benchmark/job/data/cast_info.csv
    lines_in_file: 36244344
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      movie_id: INT NOT NULL
      person_role_id: INT
      note: CHAR 100
      nr_order: INT
      role_id: INT NOT NULL
  company_name:
    file: benchmark/job/data/company_name.csv
    lines_in_file: 234997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      country_code: CHAR 6
      imdb_id: INT
      name_pcode_nf: CHAR 5
      name_pcode_sf: CHAR 5
      md5sum: CHAR 32
  company_type:
    file: benchmark/job/data/company_type.csv
    lines_in_file: 4
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      kind: CHAR 32
  movie_companies:
    file: benchmark/job/data/movie_companies.csv
    lines_in_file: 2609129
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      company_id: INT NOT NULL
      company_type_id: INT NOT NULL
      note: CHAR 100
  role_type:
    file: benchmark/job/data/role_type.csv
    lines_in_file: 12
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      role: CHAR 32 NOT NULL
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT chn.name AS uncredited_voiced_character,\n       t.title AS russian_movie\n\
        FROM char_name AS chn,\n     cast_info AS ci,\n     company_name AS cn,\n\
        \     company_type AS ct,\n     movie_companies AS mc,\n     role_type AS\
        \ rt,\n     title AS t\nWHERE ci.note LIKE \"%(voice)%\"\n  AND ci.note LIKE\
        \ \"%(uncredited)%\"\n  AND cn.country_code = \"[ru]\"\n  AND rt.role = \"\
        actor\"\n  AND t.production_year > 2005\n  AND t.id = mc.movie_id\n  AND t.id\
        \ = ci.movie_id\n  AND ci.movie_id = mc.movie_id\n  AND chn.id = ci.person_role_id\n\
        \  AND rt.id = ci.role_id\n  AND cn.id = mc.company_id\n  AND ct.id = mc.company_type_id;"
      b: "SELECT chn.name AS character,\n       t.title AS russian_mov_with_actor_producer\n\
        FROM char_name AS chn,\n     cast_info AS ci,\n     company_name AS cn,\n\
        \     company_type AS ct,\n     movie_companies AS mc,\n     role_type AS\
        \ rt,\n     title AS t\nWHERE ci.note LIKE \"%(producer)%\"\n  AND cn.country_code\
        \ = \"[ru]\"\n  AND rt.role = \"actor\"\n  AND t.production_year > 2010\n\
        \  AND t.id = mc.movie_id\n  AND t.id = ci.movie_id\n  AND ci.movie_id = mc.movie_id\n\
        \  AND chn.id = ci.person_role_id\n  AND rt.id = ci.role_id\n  AND cn.id =\
        \ mc.company_id\n  AND ct.id = mc.company_type_id;"
      c: "SELECT chn.name AS character,\n       t.title AS movie_with_american_producer\n\
        FROM char_name AS chn,\n     cast_info AS ci,\n     company_name AS cn,\n\
        \     company_type AS ct,\n     movie_companies AS mc,\n     role_type AS\
        \ rt,\n     title AS t\nWHERE ci.note LIKE \"%(producer)%\"\n  AND cn.country_code\
        \ = \"[us]\"\n  AND t.production_year > 1990\n  AND t.id = mc.movie_id\n \
        \ AND t.id = ci.movie_id\n  AND ci.movie_id = mc.movie_id\n  AND chn.id =\
        \ ci.person_role_id\n  AND rt.id = ci.role_id\n  AND cn.id = mc.company_id\n\
        \  AND ct.id = mc.company_type_id;"
