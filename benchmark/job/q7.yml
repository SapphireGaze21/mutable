description: Join Order Benchmark Query 7
suite: job
benchmark: q7
readonly: true
data:
  aka_name:
    file: benchmark/job/data/aka_name.csv
    lines_in_file: 901343
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      name: CHAR 100
      imdb_index: CHAR 3
      name_pcode_cf: CHAR 11
      name_pcode_nf: CHAR 11
      surname_pcode: CHAR 11
      md5sum: CHAR 65
  cast_info:
    file: benchmark/job/data/cast_info.csv
    lines_in_file: 36244344
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      movie_id: INT NOT NULL
      person_role_id: INT
      note: CHAR 100
      nr_order: INT
      role_id: INT NOT NULL
  info_type:
    file: benchmark/job/data/info_type.csv
    lines_in_file: 113
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      info: CHAR 32 NOT NULL
  link_type:
    file: benchmark/job/data/link_type.csv
    lines_in_file: 18
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      link: CHAR 32 NOT NULL
  movie_link:
    file: benchmark/job/data/movie_link.csv
    lines_in_file: 29997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      linked_movie_id: INT NOT NULL
      link_type_id: INT NOT NULL
  name:
    file: benchmark/job/data/name.csv
    lines_in_file: 4167491
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      imdb_index: CHAR 9
      imdb_id: INT
      gender: CHAR 1
      name_pcode_cf: CHAR 5
      name_pcode_nf: CHAR 5
      surname_pcode: CHAR 5
      md5sum: CHAR 32
  person_info:
    file: benchmark/job/data/person_info.csv
    lines_in_file: 2963664
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      info_type_id: INT NOT NULL
      info: CHAR 100 NOT NULL
      note: CHAR 100
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT n.name AS of_person,\n       t.title AS biography_movie\nFROM aka_name\
        \ AS an,\n     cast_info AS ci,\n     info_type AS it,\n     link_type AS\
        \ lt,\n     movie_link AS ml,\n     name AS n,\n     person_info AS pi,\n\
        \     title AS t\nWHERE an.name LIKE \"%a%\"\n  AND it.info = \"mini biography\"\
        \n  AND lt.link = \"features\"\n  AND (n.name_pcode_cf >= \"A\" AND n.name_pcode_cf\
        \ <= \"F\")\n  AND (n.gender= \"m\"\n       OR (n.gender = \"f\"\n       \
        \    AND n.name LIKE \"B%\"))\n  AND pi.note = \"Volker Boehm\"\n  AND (t.production_year\
        \ >= 1980 AND t.production_year <= 1995)\n  AND n.id = an.person_id\n  AND\
        \ n.id = pi.person_id\n  AND ci.person_id = n.id\n  AND t.id = ci.movie_id\n\
        \  AND ml.linked_movie_id = t.id\n  AND lt.id = ml.link_type_id\n  AND it.id\
        \ = pi.info_type_id\n  AND pi.person_id = an.person_id\n  AND pi.person_id\
        \ = ci.person_id\n  AND an.person_id = ci.person_id\n  AND ci.movie_id = ml.linked_movie_id;"
      b: "SELECT n.name AS of_person,\n       t.title AS biography_movie\nFROM aka_name\
        \ AS an,\n     cast_info AS ci,\n     info_type AS it,\n     link_type AS\
        \ lt,\n     movie_link AS ml,\n     name AS n,\n     person_info AS pi,\n\
        \     title AS t\nWHERE an.name LIKE \"%a%\"\n  AND it.info = \"mini biography\"\
        \n  AND lt.link = \"features\"\n  AND n.name_pcode_cf LIKE \"D%\"\n  AND n.gender=\
        \ \"m\"\n  AND pi.note = \"Volker Boehm\"\n  AND (t.production_year >= 1980\
        \ AND t.production_year <= 1984)\n  AND n.id = an.person_id\n  AND n.id =\
        \ pi.person_id\n  AND ci.person_id = n.id\n  AND t.id = ci.movie_id\n  AND\
        \ ml.linked_movie_id = t.id\n  AND lt.id = ml.link_type_id\n  AND it.id =\
        \ pi.info_type_id\n  AND pi.person_id = an.person_id\n  AND pi.person_id =\
        \ ci.person_id\n  AND an.person_id = ci.person_id\n  AND ci.movie_id = ml.linked_movie_id;"
      c: "SELECT n.name AS cast_member_name,\n       pi.info AS cast_member_info\n\
        FROM aka_name AS an,\n     cast_info AS ci,\n     info_type AS it,\n     link_type\
        \ AS lt,\n     movie_link AS ml,\n     name AS n,\n     person_info AS pi,\n\
        \     title AS t\nWHERE an.name != \"\"\n  AND (an.name LIKE \"%a%\"\n   \
        \    OR an.name LIKE \"A%\")\n  AND it.info = \"mini biography\"\n  AND (lt.link\
        \ = \"references\" OR lt.link = \"referenced in\" OR lt.link = \"features\"\
        \ OR lt.link = \"featured in\")\n  AND (n.name_pcode_cf >= \"A\" AND n.name_pcode_cf\
        \ <= \"F\")\n  AND (n.gender= \"m\"\n       OR (n.gender = \"f\"\n       \
        \    AND n.name LIKE \"A%\"))\n  AND pi.note != \"\"\n  AND (t.production_year\
        \ >= 1980 AND t.production_year <= 2010)\n  AND n.id = an.person_id\n  AND\
        \ n.id = pi.person_id\n  AND ci.person_id = n.id\n  AND t.id = ci.movie_id\n\
        \  AND ml.linked_movie_id = t.id\n  AND lt.id = ml.link_type_id\n  AND it.id\
        \ = pi.info_type_id\n  AND pi.person_id = an.person_id\n  AND pi.person_id\
        \ = ci.person_id\n  AND an.person_id = ci.person_id\n  AND ci.movie_id = ml.linked_movie_id;"
