systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT mi.info AS movie_budget,\n       mi_idx.info AS movie_votes,\n  \
        \     n.name AS writer,\n       t.title AS violent_liongate_movie\nFROM cast_info\
        \ AS ci,\n     company_name AS cn,\n     info_type AS it1,\n     info_type\
        \ AS it2,\n     keyword AS k,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n    \
        \ name AS n,\n     title AS t\nWHERE (ci.note = \"(writer)\" OR ci.note =\
        \ \"(head writer)\" OR ci.note = \"(written by)\" OR ci.note = \"(story)\"\
        \ OR ci.note = \"(story editor)\")\n  AND cn.name LIKE \"Lionsgate%\"\n  AND\
        \ it1.info = \"genres\"\n  AND it2.info = \"votes\"\n  AND (k.keyword = \"\
        murder\" OR k.keyword = \"violence\" OR k.keyword = \"blood\" OR k.keyword\
        \ = \"gore\" OR k.keyword = \"death\" OR k.keyword = \"female-nudity\" OR\
        \ k.keyword = \"hospital\")\n  AND (mi.info = \"Horror\" OR mi.info = \"Thriller\"\
        )\n  AND n.gender = \"m\"\n  AND t.id = mi.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND t.id = ci.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mc.movie_id\n\
        \  AND ci.movie_id = mi.movie_id\n  AND ci.movie_id = mi_idx.movie_id\n  AND\
        \ ci.movie_id = mk.movie_id\n  AND ci.movie_id = mc.movie_id\n  AND mi.movie_id\
        \ = mi_idx.movie_id\n  AND mi.movie_id = mk.movie_id\n  AND mi.movie_id =\
        \ mc.movie_id\n  AND mi_idx.movie_id = mk.movie_id\n  AND mi_idx.movie_id\
        \ = mc.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND n.id = ci.person_id\n\
        \  AND it1.id = mi.info_type_id\n  AND it2.id = mi_idx.info_type_id\n  AND\
        \ k.id = mk.keyword_id\n  AND cn.id = mc.company_id;"
      b: "SELECT mi.info AS movie_budget,\n       mi_idx.info AS movie_votes,\n  \
        \     n.name AS writer,\n       t.title AS violent_liongate_movie\nFROM cast_info\
        \ AS ci,\n     company_name AS cn,\n     info_type AS it1,\n     info_type\
        \ AS it2,\n     keyword AS k,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n    \
        \ name AS n,\n     title AS t\nWHERE (ci.note = \"(writer)\" OR ci.note =\
        \ \"(head writer)\" OR ci.note = \"(written by)\" OR ci.note = \"(story)\"\
        \ OR ci.note = \"(story editor)\")\n  AND cn.name LIKE \"Lionsgate%\"\n  AND\
        \ it1.info = \"genres\"\n  AND it2.info = \"votes\"\n  AND (k.keyword = \"\
        murder\" OR k.keyword = \"violence\" OR k.keyword = \"blood\" OR k.keyword\
        \ = \"gore\" OR k.keyword = \"death\" OR k.keyword = \"female-nudity\" OR\
        \ k.keyword = \"hospital\")\n  AND mc.note LIKE \"%(Blu-ray)%\"\n  AND (mi.info\
        \ = \"Horror\" OR mi.info = \"Thriller\")\n  AND n.gender = \"m\"\n  AND t.production_year\
        \ > 2000\n  AND (t.title LIKE \"%Freddy%\"\n       OR t.title LIKE \"%Jason%\"\
        \n       OR t.title LIKE \"Saw%\")\n  AND t.id = mi.movie_id\n  AND t.id =\
        \ mi_idx.movie_id\n  AND t.id = ci.movie_id\n  AND t.id = mk.movie_id\n  AND\
        \ t.id = mc.movie_id\n  AND ci.movie_id = mi.movie_id\n  AND ci.movie_id =\
        \ mi_idx.movie_id\n  AND ci.movie_id = mk.movie_id\n  AND ci.movie_id = mc.movie_id\n\
        \  AND mi.movie_id = mi_idx.movie_id\n  AND mi.movie_id = mk.movie_id\n  AND\
        \ mi.movie_id = mc.movie_id\n  AND mi_idx.movie_id = mk.movie_id\n  AND mi_idx.movie_id\
        \ = mc.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND n.id = ci.person_id\n\
        \  AND it1.id = mi.info_type_id\n  AND it2.id = mi_idx.info_type_id\n  AND\
        \ k.id = mk.keyword_id\n  AND cn.id = mc.company_id;"
      c: "SELECT mi.info AS movie_budget,\n       mi_idx.info AS movie_votes,\n  \
        \     n.name AS writer,\n       t.title AS violent_liongate_movie\nFROM cast_info\
        \ AS ci,\n     company_name AS cn,\n     info_type AS it1,\n     info_type\
        \ AS it2,\n     keyword AS k,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n    \
        \ name AS n,\n     title AS t\nWHERE (ci.note = \"(writer)\" OR ci.note =\
        \ \"(head writer)\" OR ci.note = \"(written by)\" OR ci.note = \"(story)\"\
        \ OR ci.note = \"(story editor)\")\n  AND cn.name LIKE \"Lionsgate%\"\n  AND\
        \ it1.info = \"genres\"\n  AND it2.info = \"votes\"\n  AND (k.keyword = \"\
        murder\" OR k.keyword = \"violence\" OR k.keyword = \"blood\" OR k.keyword\
        \ = \"gore\" OR k.keyword = \"death\" OR k.keyword = \"female-nudity\" OR\
        \ k.keyword = \"hospital\")\n  AND (mi.info = \"Horror\" OR mi.info = \"Action\"\
        \ OR mi.info = \"Sci-Fi\" OR mi.info = \"Thriller\" OR mi.info = \"Crime\"\
        \ OR mi.info = \"War\")\n  AND t.id = mi.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND t.id = ci.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mc.movie_id\n\
        \  AND ci.movie_id = mi.movie_id\n  AND ci.movie_id = mi_idx.movie_id\n  AND\
        \ ci.movie_id = mk.movie_id\n  AND ci.movie_id = mc.movie_id\n  AND mi.movie_id\
        \ = mi_idx.movie_id\n  AND mi.movie_id = mk.movie_id\n  AND mi.movie_id =\
        \ mc.movie_id\n  AND mi_idx.movie_id = mk.movie_id\n  AND mi_idx.movie_id\
        \ = mc.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND n.id = ci.person_id\n\
        \  AND it1.id = mi.info_type_id\n  AND it2.id = mi_idx.info_type_id\n  AND\
        \ k.id = mk.keyword_id\n  AND cn.id = mc.company_id;"
