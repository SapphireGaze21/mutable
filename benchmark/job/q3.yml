description: Join Order Benchmark Query 3
suite: job
benchmark: q3
readonly: true
data:
  keyword:
    file: benchmark/job/data/keyword.csv
    lines_in_file: 134170
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      keyword: CHAR 100 NOT NULL
      phonetic_code: CHAR 5
  movie_info:
    file: benchmark/job/data/movie_info.csv
    lines_in_file: 14835720
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      info_type_id: INT NOT NULL
      info: CHAR 100 NOT NULL
      note: CHAR 100
  movie_keyword:
    file: benchmark/job/data/movie_keyword.csv
    lines_in_file: 4523930
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      keyword_id: INT NOT NULL
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT t.title AS movie_title\nFROM keyword AS k,\n     movie_info AS mi,\n\
        \     movie_keyword AS mk,\n     title AS t\nWHERE k.keyword LIKE \"%sequel%\"\
        \n  AND (mi.info = \"Sweden\" OR mi.info = \"Norway\" OR mi.info = \"Germany\"\
        \ OR mi.info = \"Denmark\" OR mi.info = \"Swedish\" OR mi.info = \"Denish\"\
        \ OR mi.info = \"Norwegian\" OR mi.info = \"German\")\n  AND t.production_year\
        \ > 2005\n  AND t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND mk.movie_id\
        \ = mi.movie_id\n  AND k.id = mk.keyword_id;"
      b: "SELECT t.title AS movie_title\nFROM keyword AS k,\n     movie_info AS mi,\n\
        \     movie_keyword AS mk,\n     title AS t\nWHERE k.keyword LIKE \"%sequel%\"\
        \n  AND (mi.info = \"Bulgaria\")\n  AND t.production_year > 2010\n  AND t.id\
        \ = mi.movie_id\n  AND t.id = mk.movie_id\n  AND mk.movie_id = mi.movie_id\n\
        \  AND k.id = mk.keyword_id;"
      c: "SELECT t.title AS movie_title\nFROM keyword AS k,\n     movie_info AS mi,\n\
        \     movie_keyword AS mk,\n     title AS t\nWHERE k.keyword LIKE \"%sequel%\"\
        \n  AND (mi.info = \"Sweden\" OR mi.info = \"Norway\" OR mi.info = \"Germany\"\
        \ OR mi.info = \"Denmark\" OR mi.info = \"Swedish\" OR mi.info = \"Denish\"\
        \ OR mi.info = \"Norwegian\" OR mi.info = \"German\" OR mi.info = \"USA\"\
        \ OR mi.info = \"American\")\n  AND t.production_year > 1990\n  AND t.id =\
        \ mi.movie_id\n  AND t.id = mk.movie_id\n  AND mk.movie_id = mi.movie_id\n\
        \  AND k.id = mk.keyword_id;"
