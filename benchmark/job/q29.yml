systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT chn.name AS voiced_char,\n       n.name AS voicing_actress,\n   \
        \    t.title AS voiced_animation\nFROM aka_name AS an,\n     complete_cast\
        \ AS cc,\n     comp_cast_type AS cct1,\n     comp_cast_type AS cct2,\n   \
        \  char_name AS chn,\n     cast_info AS ci,\n     company_name AS cn,\n  \
        \   info_type AS it,\n     info_type AS it3,\n     keyword AS k,\n     movie_companies\
        \ AS mc,\n     movie_info AS mi,\n     movie_keyword AS mk,\n     name AS\
        \ n,\n     person_info AS pi,\n     role_type AS rt,\n     title AS t\nWHERE\
        \ cct1.kind = \"cast\"\n  AND cct2.kind = \"complete+verified\"\n  AND chn.name\
        \ = \"Queen\"\n  AND (ci.note = \"(voice)\" OR ci.note = \"(voice) (uncredited)\"\
        \ OR ci.note = \"(voice: English version)\")\n  AND cn.country_code = \"[us]\"\
        \n  AND it.info = \"release dates\"\n  AND it3.info = \"trivia\"\n  AND k.keyword\
        \ = \"computer-animation\"\n  AND mi.info != \"\"\n  AND (mi.info LIKE \"\
        Japan:%200%\"\n       OR mi.info LIKE \"USA:%200%\")\n  AND n.gender = \"\
        f\"\n  AND n.name LIKE \"%An%\"\n  AND rt.role = \"actress\"\n  AND t.title\
        \ = \"Shrek 2\"\n  AND (t.production_year >= 2000 AND t.production_year <=\
        \ 2010)\n  AND t.id = mi.movie_id\n  AND t.id = mc.movie_id\n  AND t.id =\
        \ ci.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = cc.movie_id\n  AND mc.movie_id\
        \ = ci.movie_id\n  AND mc.movie_id = mi.movie_id\n  AND mc.movie_id = mk.movie_id\n\
        \  AND mc.movie_id = cc.movie_id\n  AND mi.movie_id = ci.movie_id\n  AND mi.movie_id\
        \ = mk.movie_id\n  AND mi.movie_id = cc.movie_id\n  AND ci.movie_id = mk.movie_id\n\
        \  AND ci.movie_id = cc.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND cn.id\
        \ = mc.company_id\n  AND it.id = mi.info_type_id\n  AND n.id = ci.person_id\n\
        \  AND rt.id = ci.role_id\n  AND n.id = an.person_id\n  AND ci.person_id =\
        \ an.person_id\n  AND chn.id = ci.person_role_id\n  AND n.id = pi.person_id\n\
        \  AND ci.person_id = pi.person_id\n  AND it3.id = pi.info_type_id\n  AND\
        \ k.id = mk.keyword_id\n  AND cct1.id = cc.subject_id\n  AND cct2.id = cc.status_id;"
      b: "SELECT chn.name AS voiced_char,\n       n.name AS voicing_actress,\n   \
        \    t.title AS voiced_animation\nFROM aka_name AS an,\n     complete_cast\
        \ AS cc,\n     comp_cast_type AS cct1,\n     comp_cast_type AS cct2,\n   \
        \  char_name AS chn,\n     cast_info AS ci,\n     company_name AS cn,\n  \
        \   info_type AS it,\n     info_type AS it3,\n     keyword AS k,\n     movie_companies\
        \ AS mc,\n     movie_info AS mi,\n     movie_keyword AS mk,\n     name AS\
        \ n,\n     person_info AS pi,\n     role_type AS rt,\n     title AS t\nWHERE\
        \ cct1.kind = \"cast\"\n  AND cct2.kind = \"complete+verified\"\n  AND chn.name\
        \ = \"Queen\"\n  AND (ci.note = \"(voice)\" OR ci.note = \"(voice) (uncredited)\"\
        \ OR ci.note = \"(voice: English version)\")\n  AND cn.country_code = \"[us]\"\
        \n  AND it.info = \"release dates\"\n  AND it3.info = \"height\"\n  AND k.keyword\
        \ = \"computer-animation\"\n  AND mi.info LIKE \"USA:%200%\"\n  AND n.gender\
        \ = \"f\"\n  AND n.name LIKE \"%An%\"\n  AND rt.role = \"actress\"\n  AND\
        \ t.title = \"Shrek 2\"\n  AND (t.production_year >= 2000 AND t.production_year\
        \ <= 2005)\n  AND t.id = mi.movie_id\n  AND t.id = mc.movie_id\n  AND t.id\
        \ = ci.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = cc.movie_id\n  AND\
        \ mc.movie_id = ci.movie_id\n  AND mc.movie_id = mi.movie_id\n  AND mc.movie_id\
        \ = mk.movie_id\n  AND mc.movie_id = cc.movie_id\n  AND mi.movie_id = ci.movie_id\n\
        \  AND mi.movie_id = mk.movie_id\n  AND mi.movie_id = cc.movie_id\n  AND ci.movie_id\
        \ = mk.movie_id\n  AND ci.movie_id = cc.movie_id\n  AND mk.movie_id = cc.movie_id\n\
        \  AND cn.id = mc.company_id\n  AND it.id = mi.info_type_id\n  AND n.id =\
        \ ci.person_id\n  AND rt.id = ci.role_id\n  AND n.id = an.person_id\n  AND\
        \ ci.person_id = an.person_id\n  AND chn.id = ci.person_role_id\n  AND n.id\
        \ = pi.person_id\n  AND ci.person_id = pi.person_id\n  AND it3.id = pi.info_type_id\n\
        \  AND k.id = mk.keyword_id\n  AND cct1.id = cc.subject_id\n  AND cct2.id\
        \ = cc.status_id;"
      c: "SELECT chn.name AS voiced_char,\n       n.name AS voicing_actress,\n   \
        \    t.title AS voiced_animation\nFROM aka_name AS an,\n     complete_cast\
        \ AS cc,\n     comp_cast_type AS cct1,\n     comp_cast_type AS cct2,\n   \
        \  char_name AS chn,\n     cast_info AS ci,\n     company_name AS cn,\n  \
        \   info_type AS it,\n     info_type AS it3,\n     keyword AS k,\n     movie_companies\
        \ AS mc,\n     movie_info AS mi,\n     movie_keyword AS mk,\n     name AS\
        \ n,\n     person_info AS pi,\n     role_type AS rt,\n     title AS t\nWHERE\
        \ cct1.kind = \"cast\"\n  AND cct2.kind = \"complete+verified\"\n  AND (ci.note\
        \ = \"(voice)\" OR ci.note = \"(voice: Japanese version)\" OR ci.note = \"\
        (voice) (uncredited)\" OR ci.note = \"(voice: English version)\")\n  AND cn.country_code\
        \ = \"[us]\"\n  AND it.info = \"release dates\"\n  AND it3.info = \"trivia\"\
        \n  AND k.keyword = \"computer-animation\"\n  AND mi.info != \"\"\n  AND (mi.info\
        \ LIKE \"Japan:%200%\"\n       OR mi.info LIKE \"USA:%200%\")\n  AND n.gender\
        \ = \"f\"\n  AND n.name LIKE \"%An%\"\n  AND rt.role = \"actress\"\n  AND\
        \ (t.production_year >= 2000 AND t.production_year <= 2010)\n  AND t.id =\
        \ mi.movie_id\n  AND t.id = mc.movie_id\n  AND t.id = ci.movie_id\n  AND t.id\
        \ = mk.movie_id\n  AND t.id = cc.movie_id\n  AND mc.movie_id = ci.movie_id\n\
        \  AND mc.movie_id = mi.movie_id\n  AND mc.movie_id = mk.movie_id\n  AND mc.movie_id\
        \ = cc.movie_id\n  AND mi.movie_id = ci.movie_id\n  AND mi.movie_id = mk.movie_id\n\
        \  AND mi.movie_id = cc.movie_id\n  AND ci.movie_id = mk.movie_id\n  AND ci.movie_id\
        \ = cc.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND cn.id = mc.company_id\n\
        \  AND it.id = mi.info_type_id\n  AND n.id = ci.person_id\n  AND rt.id = ci.role_id\n\
        \  AND n.id = an.person_id\n  AND ci.person_id = an.person_id\n  AND chn.id\
        \ = ci.person_role_id\n  AND n.id = pi.person_id\n  AND ci.person_id = pi.person_id\n\
        \  AND it3.id = pi.info_type_id\n  AND k.id = mk.keyword_id\n  AND cct1.id\
        \ = cc.subject_id\n  AND cct2.id = cc.status_id;"
