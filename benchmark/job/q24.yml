systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT chn.name AS voiced_char_name,\n       n.name AS voicing_actress_name,\n\
        \       t.title AS voiced_action_movie_jap_eng\nFROM aka_name AS an,\n   \
        \  char_name AS chn,\n     cast_info AS ci,\n     company_name AS cn,\n  \
        \   info_type AS it,\n     keyword AS k,\n     movie_companies AS mc,\n  \
        \   movie_info AS mi,\n     movie_keyword AS mk,\n     name AS n,\n     role_type\
        \ AS rt,\n     title AS t\nWHERE (ci.note = \"(voice)\" OR ci.note = \"(voice:\
        \ Japanese version)\" OR ci.note = \"(voice) (uncredited)\" OR ci.note = \"\
        (voice: English version)\")\n  AND cn.country_code = \"[us]\"\n  AND it.info\
        \ = \"release dates\"\n  AND (k.keyword = \"hero\" OR k.keyword = \"martial-arts\"\
        \ OR k.keyword = \"hand-to-hand-combat\")\n  AND mi.info != \"\"\n  AND (mi.info\
        \ LIKE \"Japan:%201%\"\n       OR mi.info LIKE \"USA:%201%\")\n  AND n.gender\
        \ = \"f\"\n  AND n.name LIKE \"%An%\"\n  AND rt.role = \"actress\"\n  AND\
        \ t.production_year > 2010\n  AND t.id = mi.movie_id\n  AND t.id = mc.movie_id\n\
        \  AND t.id = ci.movie_id\n  AND t.id = mk.movie_id\n  AND mc.movie_id = ci.movie_id\n\
        \  AND mc.movie_id = mi.movie_id\n  AND mc.movie_id = mk.movie_id\n  AND mi.movie_id\
        \ = ci.movie_id\n  AND mi.movie_id = mk.movie_id\n  AND ci.movie_id = mk.movie_id\n\
        \  AND cn.id = mc.company_id\n  AND it.id = mi.info_type_id\n  AND n.id =\
        \ ci.person_id\n  AND rt.id = ci.role_id\n  AND n.id = an.person_id\n  AND\
        \ ci.person_id = an.person_id\n  AND chn.id = ci.person_role_id\n  AND k.id\
        \ = mk.keyword_id;"
      b: "SELECT chn.name AS voiced_char_name,\n       n.name AS voicing_actress_name,\n\
        \       t.title AS kung_fu_panda\nFROM aka_name AS an,\n     char_name AS\
        \ chn,\n     cast_info AS ci,\n     company_name AS cn,\n     info_type AS\
        \ it,\n     keyword AS k,\n     movie_companies AS mc,\n     movie_info AS\
        \ mi,\n     movie_keyword AS mk,\n     name AS n,\n     role_type AS rt,\n\
        \     title AS t\nWHERE (ci.note = \"(voice)\" OR ci.note = \"(voice: Japanese\
        \ version)\" OR ci.note = \"(voice) (uncredited)\" OR ci.note = \"(voice:\
        \ English version)\")\n  AND cn.country_code = \"[us]\"\n  AND cn.name = \"\
        DreamWorks Animation\"\n  AND it.info = \"release dates\"\n  AND (k.keyword\
        \ = \"hero\" OR k.keyword = \"martial-arts\" OR k.keyword = \"hand-to-hand-combat\"\
        \ OR k.keyword = \"computer-animated-movie\")\n  AND mi.info != \"\"\n  AND\
        \ (mi.info LIKE \"Japan:%201%\"\n       OR mi.info LIKE \"USA:%201%\")\n \
        \ AND n.gender = \"f\"\n  AND n.name LIKE \"%An%\"\n  AND rt.role = \"actress\"\
        \n  AND t.production_year > 2010\n  AND t.title LIKE \"Kung Fu Panda%\"\n\
        \  AND t.id = mi.movie_id\n  AND t.id = mc.movie_id\n  AND t.id = ci.movie_id\n\
        \  AND t.id = mk.movie_id\n  AND mc.movie_id = ci.movie_id\n  AND mc.movie_id\
        \ = mi.movie_id\n  AND mc.movie_id = mk.movie_id\n  AND mi.movie_id = ci.movie_id\n\
        \  AND mi.movie_id = mk.movie_id\n  AND ci.movie_id = mk.movie_id\n  AND cn.id\
        \ = mc.company_id\n  AND it.id = mi.info_type_id\n  AND n.id = ci.person_id\n\
        \  AND rt.id = ci.role_id\n  AND n.id = an.person_id\n  AND ci.person_id =\
        \ an.person_id\n  AND chn.id = ci.person_role_id\n  AND k.id = mk.keyword_id;"
