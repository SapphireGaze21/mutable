description: Join Order Benchmark Query 21
suite: job
benchmark: q21
readonly: true
data:
  company_name:
    file: benchmark/job/data/company_name.csv
    lines_in_file: 234997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      country_code: CHAR 6
      imdb_id: INT
      name_pcode_nf: CHAR 5
      name_pcode_sf: CHAR 5
      md5sum: CHAR 32
  company_type:
    file: benchmark/job/data/company_type.csv
    lines_in_file: 4
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      kind: CHAR 32
  keyword:
    file: benchmark/job/data/keyword.csv
    lines_in_file: 134170
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      keyword: CHAR 100 NOT NULL
      phonetic_code: CHAR 5
  link_type:
    file: benchmark/job/data/link_type.csv
    lines_in_file: 18
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      link: CHAR 32 NOT NULL
  movie_companies:
    file: benchmark/job/data/movie_companies.csv
    lines_in_file: 2609129
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      company_id: INT NOT NULL
      company_type_id: INT NOT NULL
      note: CHAR 100
  movie_info:
    file: benchmark/job/data/movie_info.csv
    lines_in_file: 14835720
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      info_type_id: INT NOT NULL
      info: CHAR 100 NOT NULL
      note: CHAR 100
  movie_keyword:
    file: benchmark/job/data/movie_keyword.csv
    lines_in_file: 4523930
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      keyword_id: INT NOT NULL
  movie_link:
    file: benchmark/job/data/movie_link.csv
    lines_in_file: 29997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      linked_movie_id: INT NOT NULL
      link_type_id: INT NOT NULL
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT cn.name AS company_name,\n       lt.link AS link_type,\n       t.title\
        \ AS western_follow_up\nFROM company_name AS cn,\n     company_type AS ct,\n\
        \     keyword AS k,\n     link_type AS lt,\n     movie_companies AS mc,\n\
        \     movie_info AS mi,\n     movie_keyword AS mk,\n     movie_link AS ml,\n\
        \     title AS t\nWHERE cn.country_code != \"[pl]\"\n  AND (cn.name LIKE \"\
        %Film%\"\n       OR cn.name LIKE \"%Warner%\")\n  AND ct.kind = \"production\
        \ companies\"\n  AND k.keyword = \"sequel\"\n  AND lt.link LIKE \"%follow%\"\
        \n  AND mc.note = \"\"\n  AND (mi.info = \"Sweden\" OR mi.info = \"Norway\"\
        \ OR mi.info = \"Germany\" OR mi.info = \"Denmark\" OR mi.info = \"Swedish\"\
        \ OR mi.info = \"Denish\" OR mi.info = \"Norwegian\" OR mi.info = \"German\"\
        )\n  AND (t.production_year >= 1950 AND t.production_year <= 2000)\n  AND\
        \ lt.id = ml.link_type_id\n  AND ml.movie_id = t.id\n  AND t.id = mk.movie_id\n\
        \  AND mk.keyword_id = k.id\n  AND t.id = mc.movie_id\n  AND mc.company_type_id\
        \ = ct.id\n  AND mc.company_id = cn.id\n  AND mi.movie_id = t.id\n  AND ml.movie_id\
        \ = mk.movie_id\n  AND ml.movie_id = mc.movie_id\n  AND mk.movie_id = mc.movie_id\n\
        \  AND ml.movie_id = mi.movie_id\n  AND mk.movie_id = mi.movie_id\n  AND mc.movie_id\
        \ = mi.movie_id;"
      b: "SELECT cn.name AS company_name,\n       lt.link AS link_type,\n       t.title\
        \ AS german_follow_up\nFROM company_name AS cn,\n     company_type AS ct,\n\
        \     keyword AS k,\n     link_type AS lt,\n     movie_companies AS mc,\n\
        \     movie_info AS mi,\n     movie_keyword AS mk,\n     movie_link AS ml,\n\
        \     title AS t\nWHERE cn.country_code != \"[pl]\"\n  AND (cn.name LIKE \"\
        %Film%\"\n       OR cn.name LIKE \"%Warner%\")\n  AND ct.kind = \"production\
        \ companies\"\n  AND k.keyword = \"sequel\"\n  AND lt.link LIKE \"%follow%\"\
        \n  AND mc.note = \"\"\n  AND (mi.info = \"Germany\" OR mi.info = \"German\"\
        )\n  AND (t.production_year >= 2000 AND t.production_year <= 2010)\n  AND\
        \ lt.id = ml.link_type_id\n  AND ml.movie_id = t.id\n  AND t.id = mk.movie_id\n\
        \  AND mk.keyword_id = k.id\n  AND t.id = mc.movie_id\n  AND mc.company_type_id\
        \ = ct.id\n  AND mc.company_id = cn.id\n  AND mi.movie_id = t.id\n  AND ml.movie_id\
        \ = mk.movie_id\n  AND ml.movie_id = mc.movie_id\n  AND mk.movie_id = mc.movie_id\n\
        \  AND ml.movie_id = mi.movie_id\n  AND mk.movie_id = mi.movie_id\n  AND mc.movie_id\
        \ = mi.movie_id;"
      c: "SELECT cn.name AS company_name,\n       lt.link AS link_type,\n       t.title\
        \ AS western_follow_up\nFROM company_name AS cn,\n     company_type AS ct,\n\
        \     keyword AS k,\n     link_type AS lt,\n     movie_companies AS mc,\n\
        \     movie_info AS mi,\n     movie_keyword AS mk,\n     movie_link AS ml,\n\
        \     title AS t\nWHERE cn.country_code != \"[pl]\"\n  AND (cn.name LIKE \"\
        %Film%\"\n       OR cn.name LIKE \"%Warner%\")\n  AND ct.kind = \"production\
        \ companies\"\n  AND k.keyword = \"sequel\"\n  AND lt.link LIKE \"%follow%\"\
        \n  AND mc.note = \"\"\n  AND (mi.info = \"Sweden\" OR mi.info = \"Norway\"\
        \ OR mi.info = \"Germany\" OR mi.info = \"Denmark\" OR mi.info = \"Swedish\"\
        \ OR mi.info = \"Denish\" OR mi.info = \"Norwegian\" OR mi.info = \"German\"\
        \ OR mi.info = \"English\")\n  AND (t.production_year >= 1950 AND t.production_year\
        \ <= 2010)\n  AND lt.id = ml.link_type_id\n  AND ml.movie_id = t.id\n  AND\
        \ t.id = mk.movie_id\n  AND mk.keyword_id = k.id\n  AND t.id = mc.movie_id\n\
        \  AND mc.company_type_id = ct.id\n  AND mc.company_id = cn.id\n  AND mi.movie_id\
        \ = t.id\n  AND ml.movie_id = mk.movie_id\n  AND ml.movie_id = mc.movie_id\n\
        \  AND mk.movie_id = mc.movie_id\n  AND ml.movie_id = mi.movie_id\n  AND mk.movie_id\
        \ = mi.movie_id\n  AND mc.movie_id = mi.movie_id;"
