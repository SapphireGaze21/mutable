systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT cn.name AS movie_company,\n       mi_idx.info AS rating,\n      \
        \ t.title AS complete_euro_dark_movie\nFROM complete_cast AS cc,\n     comp_cast_type\
        \ AS cct1,\n     comp_cast_type AS cct2,\n     company_name AS cn,\n     company_type\
        \ AS ct,\n     info_type AS it1,\n     info_type AS it2,\n     keyword AS\
        \ k,\n     kind_type AS kt,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n    \
        \ title AS t\nWHERE cct1.kind = \"crew\"\n  AND cct2.kind != \"complete+verified\"\
        \n  AND cn.country_code != \"[us]\"\n  AND it1.info = \"countries\"\n  AND\
        \ it2.info = \"rating\"\n  AND (k.keyword = \"murder\" OR k.keyword = \"murder-in-title\"\
        \ OR k.keyword = \"blood\" OR k.keyword = \"violence\")\n  AND (kt.kind =\
        \ \"movie\" OR kt.kind = \"episode\")\n  AND NOT (mc.note LIKE \"%(USA)%\"\
        )\n  AND mc.note LIKE \"%(200%)%\"\n  AND (mi.info = \"Sweden\" OR mi.info\
        \ = \"Norway\" OR mi.info = \"Germany\" OR mi.info = \"Denmark\" OR mi.info\
        \ = \"Swedish\" OR mi.info = \"Danish\" OR mi.info = \"Norwegian\" OR mi.info\
        \ = \"German\" OR mi.info = \"USA\" OR mi.info = \"American\")\n  AND mi_idx.info\
        \ < \"8.5\"\n  AND t.production_year > 2000\n  AND kt.id = t.kind_id\n  AND\
        \ t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND t.id = mc.movie_id\n  AND t.id = cc.movie_id\n  AND mk.movie_id = mi.movie_id\n\
        \  AND mk.movie_id = mi_idx.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND\
        \ mk.movie_id = cc.movie_id\n  AND mi.movie_id = mi_idx.movie_id\n  AND mi.movie_id\
        \ = mc.movie_id\n  AND mi.movie_id = cc.movie_id\n  AND mc.movie_id = mi_idx.movie_id\n\
        \  AND mc.movie_id = cc.movie_id\n  AND mi_idx.movie_id = cc.movie_id\n  AND\
        \ k.id = mk.keyword_id\n  AND it1.id = mi.info_type_id\n  AND it2.id = mi_idx.info_type_id\n\
        \  AND ct.id = mc.company_type_id\n  AND cn.id = mc.company_id\n  AND cct1.id\
        \ = cc.subject_id\n  AND cct2.id = cc.status_id;"
      b: "SELECT cn.name AS movie_company,\n       mi_idx.info AS rating,\n      \
        \ t.title AS complete_euro_dark_movie\nFROM complete_cast AS cc,\n     comp_cast_type\
        \ AS cct1,\n     comp_cast_type AS cct2,\n     company_name AS cn,\n     company_type\
        \ AS ct,\n     info_type AS it1,\n     info_type AS it2,\n     keyword AS\
        \ k,\n     kind_type AS kt,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n    \
        \ title AS t\nWHERE cct1.kind = \"crew\"\n  AND cct2.kind != \"complete+verified\"\
        \n  AND cn.country_code != \"[us]\"\n  AND it1.info = \"countries\"\n  AND\
        \ it2.info = \"rating\"\n  AND (k.keyword = \"murder\" OR k.keyword = \"murder-in-title\"\
        \ OR k.keyword = \"blood\" OR k.keyword = \"violence\")\n  AND (kt.kind =\
        \ \"movie\" OR kt.kind = \"episode\")\n  AND NOT (mc.note LIKE \"%(USA)%\"\
        )\n  AND mc.note LIKE \"%(200%)%\"\n  AND (mi.info = \"Sweden\" OR mi.info\
        \ = \"Germany\" OR mi.info = \"Swedish\" OR mi.info = \"German\")\n  AND mi_idx.info\
        \ > \"6.5\"\n  AND t.production_year > 2005\n  AND kt.id = t.kind_id\n  AND\
        \ t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND t.id = mc.movie_id\n  AND t.id = cc.movie_id\n  AND mk.movie_id = mi.movie_id\n\
        \  AND mk.movie_id = mi_idx.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND\
        \ mk.movie_id = cc.movie_id\n  AND mi.movie_id = mi_idx.movie_id\n  AND mi.movie_id\
        \ = mc.movie_id\n  AND mi.movie_id = cc.movie_id\n  AND mc.movie_id = mi_idx.movie_id\n\
        \  AND mc.movie_id = cc.movie_id\n  AND mi_idx.movie_id = cc.movie_id\n  AND\
        \ k.id = mk.keyword_id\n  AND it1.id = mi.info_type_id\n  AND it2.id = mi_idx.info_type_id\n\
        \  AND ct.id = mc.company_type_id\n  AND cn.id = mc.company_id\n  AND cct1.id\
        \ = cc.subject_id\n  AND cct2.id = cc.status_id;"
      c: "SELECT cn.name AS movie_company,\n       mi_idx.info AS rating,\n      \
        \ t.title AS complete_euro_dark_movie\nFROM complete_cast AS cc,\n     comp_cast_type\
        \ AS cct1,\n     comp_cast_type AS cct2,\n     company_name AS cn,\n     company_type\
        \ AS ct,\n     info_type AS it1,\n     info_type AS it2,\n     keyword AS\
        \ k,\n     kind_type AS kt,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_info_idx AS mi_idx,\n     movie_keyword AS mk,\n    \
        \ title AS t\nWHERE cct1.kind = \"cast\"\n  AND cct2.kind = \"complete\"\n\
        \  AND cn.country_code != \"[us]\"\n  AND it1.info = \"countries\"\n  AND\
        \ it2.info = \"rating\"\n  AND (k.keyword = \"murder\" OR k.keyword = \"murder-in-title\"\
        \ OR k.keyword = \"blood\" OR k.keyword = \"violence\")\n  AND (kt.kind =\
        \ \"movie\" OR kt.kind = \"episode\")\n  AND NOT (mc.note LIKE \"%(USA)%\"\
        )\n  AND mc.note LIKE \"%(200%)%\"\n  AND (mi.info = \"Sweden\" OR mi.info\
        \ = \"Norway\" OR mi.info = \"Germany\" OR mi.info = \"Denmark\" OR mi.info\
        \ = \"Swedish\" OR mi.info = \"Danish\" OR mi.info = \"Norwegian\" OR mi.info\
        \ = \"German\" OR mi.info = \"USA\" OR mi.info = \"American\")\n  AND mi_idx.info\
        \ < \"8.5\"\n  AND t.production_year > 2005\n  AND kt.id = t.kind_id\n  AND\
        \ t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND t.id = mc.movie_id\n  AND t.id = cc.movie_id\n  AND mk.movie_id = mi.movie_id\n\
        \  AND mk.movie_id = mi_idx.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND\
        \ mk.movie_id = cc.movie_id\n  AND mi.movie_id = mi_idx.movie_id\n  AND mi.movie_id\
        \ = mc.movie_id\n  AND mi.movie_id = cc.movie_id\n  AND mc.movie_id = mi_idx.movie_id\n\
        \  AND mc.movie_id = cc.movie_id\n  AND mi_idx.movie_id = cc.movie_id\n  AND\
        \ k.id = mk.keyword_id\n  AND it1.id = mi.info_type_id\n  AND it2.id = mi_idx.info_type_id\n\
        \  AND ct.id = mc.company_type_id\n  AND cn.id = mc.company_id\n  AND cct1.id\
        \ = cc.subject_id\n  AND cct2.id = cc.status_id;"
