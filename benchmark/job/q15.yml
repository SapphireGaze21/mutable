systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT mi.info AS release_date,\n       t.title AS internet_movie\nFROM\
        \ aka_title AS at,\n     company_name AS cn,\n     company_type AS ct,\n \
        \    info_type AS it1,\n     keyword AS k,\n     movie_companies AS mc,\n\
        \     movie_info AS mi,\n     movie_keyword AS mk,\n     title AS t\nWHERE\
        \ cn.country_code = \"[us]\"\n  AND it1.info = \"release dates\"\n  AND mc.note\
        \ LIKE \"%(200%)%\"\n  AND mc.note LIKE \"%(worldwide)%\"\n  AND mi.note LIKE\
        \ \"%internet%\"\n  AND mi.info LIKE \"USA:% 200%\"\n  AND t.production_year\
        \ > 2000\n  AND t.id = at.movie_id\n  AND t.id = mi.movie_id\n  AND t.id =\
        \ mk.movie_id\n  AND t.id = mc.movie_id\n  AND mk.movie_id = mi.movie_id\n\
        \  AND mk.movie_id = mc.movie_id\n  AND mk.movie_id = at.movie_id\n  AND mi.movie_id\
        \ = mc.movie_id\n  AND mi.movie_id = at.movie_id\n  AND mc.movie_id = at.movie_id\n\
        \  AND k.id = mk.keyword_id\n  AND it1.id = mi.info_type_id\n  AND cn.id =\
        \ mc.company_id\n  AND ct.id = mc.company_type_id;"
      b: "SELECT mi.info AS release_date,\n       t.title AS youtube_movie\nFROM aka_title\
        \ AS at,\n     company_name AS cn,\n     company_type AS ct,\n     info_type\
        \ AS it1,\n     keyword AS k,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_keyword AS mk,\n     title AS t\nWHERE cn.country_code\
        \ = \"[us]\"\n  AND cn.name = \"YouTube\"\n  AND it1.info = \"release dates\"\
        \n  AND mc.note LIKE \"%(200%)%\"\n  AND mc.note LIKE \"%(worldwide)%\"\n\
        \  AND mi.note LIKE \"%internet%\"\n  AND mi.info LIKE \"USA:% 200%\"\n  AND\
        \ (t.production_year >= 2005 AND t.production_year <= 2010)\n  AND t.id =\
        \ at.movie_id\n  AND t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND t.id\
        \ = mc.movie_id\n  AND mk.movie_id = mi.movie_id\n  AND mk.movie_id = mc.movie_id\n\
        \  AND mk.movie_id = at.movie_id\n  AND mi.movie_id = mc.movie_id\n  AND mi.movie_id\
        \ = at.movie_id\n  AND mc.movie_id = at.movie_id\n  AND k.id = mk.keyword_id\n\
        \  AND it1.id = mi.info_type_id\n  AND cn.id = mc.company_id\n  AND ct.id\
        \ = mc.company_type_id;"
      c: "SELECT mi.info AS release_date,\n       t.title AS modern_american_internet_movie\n\
        FROM aka_title AS at,\n     company_name AS cn,\n     company_type AS ct,\n\
        \     info_type AS it1,\n     keyword AS k,\n     movie_companies AS mc,\n\
        \     movie_info AS mi,\n     movie_keyword AS mk,\n     title AS t\nWHERE\
        \ cn.country_code = \"[us]\"\n  AND it1.info = \"release dates\"\n  AND mi.note\
        \ LIKE \"%internet%\"\n  AND mi.info != \"\"\n  AND (mi.info LIKE \"USA:%\
        \ 199%\"\n       OR mi.info LIKE \"USA:% 200%\")\n  AND t.production_year\
        \ > 1990\n  AND t.id = at.movie_id\n  AND t.id = mi.movie_id\n  AND t.id =\
        \ mk.movie_id\n  AND t.id = mc.movie_id\n  AND mk.movie_id = mi.movie_id\n\
        \  AND mk.movie_id = mc.movie_id\n  AND mk.movie_id = at.movie_id\n  AND mi.movie_id\
        \ = mc.movie_id\n  AND mi.movie_id = at.movie_id\n  AND mc.movie_id = at.movie_id\n\
        \  AND k.id = mk.keyword_id\n  AND it1.id = mi.info_type_id\n  AND cn.id =\
        \ mc.company_id\n  AND ct.id = mc.company_type_id;"
      d: "SELECT at.title AS aka_title,\n       t.title AS internet_movie_title\n\
        FROM aka_title AS at,\n     company_name AS cn,\n     company_type AS ct,\n\
        \     info_type AS it1,\n     keyword AS k,\n     movie_companies AS mc,\n\
        \     movie_info AS mi,\n     movie_keyword AS mk,\n     title AS t\nWHERE\
        \ cn.country_code = \"[us]\"\n  AND it1.info = \"release dates\"\n  AND mi.note\
        \ LIKE \"%internet%\"\n  AND t.production_year > 1990\n  AND t.id = at.movie_id\n\
        \  AND t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mc.movie_id\n\
        \  AND mk.movie_id = mi.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND mk.movie_id\
        \ = at.movie_id\n  AND mi.movie_id = mc.movie_id\n  AND mi.movie_id = at.movie_id\n\
        \  AND mc.movie_id = at.movie_id\n  AND k.id = mk.keyword_id\n  AND it1.id\
        \ = mi.info_type_id\n  AND cn.id = mc.company_id\n  AND ct.id = mc.company_type_id;"
