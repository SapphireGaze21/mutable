description: Join Order Benchmark Query 1
suite: job
benchmark: q1
readonly: true
data:
  company_type:
    file: benchmark/job/data/company_type.csv
    lines_in_file: 4
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      kind: CHAR 32
  info_type:
    file: benchmark/job/data/info_type.csv
    lines_in_file: 113
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      info: CHAR 32 NOT NULL
  movie_companies:
    file: benchmark/job/data/movie_companies.csv
    lines_in_file: 2609129
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      company_id: INT NOT NULL
      company_type_id: INT NOT NULL
      note: CHAR 100
  movie_info_idx:
    file: benchmark/job/data/movie_info_idx.csv
    lines_in_file: 1380035
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      info_type_id: INT NOT NULL
      info: CHAR 100 NOT NULL
      note: CHAR 1
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT mc.note AS production_note,\n       t.title AS movie_title,\n   \
        \    t.production_year AS movie_year\nFROM company_type AS ct,\n     info_type\
        \ AS it,\n     movie_companies AS mc,\n     movie_info_idx AS mi_idx,\n  \
        \   title AS t\nWHERE ct.kind = \"production companies\"\n  AND it.info =\
        \ \"top 250 rank\"\n  AND NOT (mc.note LIKE \"%(as Metro-Goldwyn-Mayer Pictures)%\"\
        )\n  AND (mc.note LIKE \"%(co-production)%\"\n       OR mc.note LIKE \"%(presents)%\"\
        )\n  AND ct.id = mc.company_type_id\n  AND t.id = mc.movie_id\n  AND t.id\
        \ = mi_idx.movie_id\n  AND mc.movie_id = mi_idx.movie_id\n  AND it.id = mi_idx.info_type_id;"
      b: "SELECT mc.note AS production_note,\n       t.title AS movie_title,\n   \
        \    t.production_year AS movie_year\nFROM company_type AS ct,\n     info_type\
        \ AS it,\n     movie_companies AS mc,\n     movie_info_idx AS mi_idx,\n  \
        \   title AS t\nWHERE ct.kind = \"production companies\"\n  AND it.info =\
        \ \"bottom 10 rank\"\n  AND NOT (mc.note LIKE \"%(as Metro-Goldwyn-Mayer Pictures)%\"\
        )\n  AND (t.production_year >= 2005 AND t.production_year <= 2010)\n  AND\
        \ ct.id = mc.company_type_id\n  AND t.id = mc.movie_id\n  AND t.id = mi_idx.movie_id\n\
        \  AND mc.movie_id = mi_idx.movie_id\n  AND it.id = mi_idx.info_type_id;"
      c: "SELECT mc.note AS production_note,\n       t.title AS movie_title,\n   \
        \    t.production_year AS movie_year\nFROM company_type AS ct,\n     info_type\
        \ AS it,\n     movie_companies AS mc,\n     movie_info_idx AS mi_idx,\n  \
        \   title AS t\nWHERE ct.kind = \"production companies\"\n  AND it.info =\
        \ \"top 250 rank\"\n  AND NOT (mc.note LIKE \"%(as Metro-Goldwyn-Mayer Pictures)%\"\
        )\n  AND (mc.note LIKE \"%(co-production)%\")\n  AND t.production_year >2010\n\
        \  AND ct.id = mc.company_type_id\n  AND t.id = mc.movie_id\n  AND t.id =\
        \ mi_idx.movie_id\n  AND mc.movie_id = mi_idx.movie_id\n  AND it.id = mi_idx.info_type_id;"
      d: "SELECT mc.note AS production_note,\n       t.title AS movie_title,\n   \
        \    t.production_year AS movie_year\nFROM company_type AS ct,\n     info_type\
        \ AS it,\n     movie_companies AS mc,\n     movie_info_idx AS mi_idx,\n  \
        \   title AS t\nWHERE ct.kind = \"production companies\"\n  AND it.info =\
        \ \"bottom 10 rank\"\n  AND NOT (mc.note LIKE \"%(as Metro-Goldwyn-Mayer Pictures)%\"\
        )\n  AND t.production_year >2000\n  AND ct.id = mc.company_type_id\n  AND\
        \ t.id = mc.movie_id\n  AND t.id = mi_idx.movie_id\n  AND mc.movie_id = mi_idx.movie_id\n\
        \  AND it.id = mi_idx.info_type_id;"
