systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT kt.kind AS movie_kind,\n       t.title AS complete_us_internet_movie\n\
        FROM complete_cast AS cc,\n     comp_cast_type AS cct1,\n     company_name\
        \ AS cn,\n     company_type AS ct,\n     info_type AS it1,\n     keyword AS\
        \ k,\n     kind_type AS kt,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_keyword AS mk,\n     title AS t\nWHERE cct1.kind = \"\
        complete+verified\"\n  AND cn.country_code = \"[us]\"\n  AND it1.info = \"\
        release dates\"\n  AND (kt.kind = \"movie\")\n  AND mi.note LIKE \"%internet%\"\
        \n  AND mi.info != \"\"\n  AND (mi.info LIKE \"USA:% 199%\"\n       OR mi.info\
        \ LIKE \"USA:% 200%\")\n  AND t.production_year > 2000\n  AND kt.id = t.kind_id\n\
        \  AND t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mc.movie_id\n\
        \  AND t.id = cc.movie_id\n  AND mk.movie_id = mi.movie_id\n  AND mk.movie_id\
        \ = mc.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND mi.movie_id = mc.movie_id\n\
        \  AND mi.movie_id = cc.movie_id\n  AND mc.movie_id = cc.movie_id\n  AND k.id\
        \ = mk.keyword_id\n  AND it1.id = mi.info_type_id\n  AND cn.id = mc.company_id\n\
        \  AND ct.id = mc.company_type_id\n  AND cct1.id = cc.status_id;"
      b: "SELECT kt.kind AS movie_kind,\n       t.title AS complete_nerdy_internet_movie\n\
        FROM complete_cast AS cc,\n     comp_cast_type AS cct1,\n     company_name\
        \ AS cn,\n     company_type AS ct,\n     info_type AS it1,\n     keyword AS\
        \ k,\n     kind_type AS kt,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_keyword AS mk,\n     title AS t\nWHERE cct1.kind = \"\
        complete+verified\"\n  AND cn.country_code = \"[us]\"\n  AND it1.info = \"\
        release dates\"\n  AND (k.keyword = \"nerd\" OR k.keyword = \"loner\" OR k.keyword\
        \ = \"alienation\" OR k.keyword = \"dignity\")\n  AND (kt.kind = \"movie\"\
        )\n  AND mi.note LIKE \"%internet%\"\n  AND mi.info LIKE \"USA:% 200%\"\n\
        \  AND t.production_year > 2000\n  AND kt.id = t.kind_id\n  AND t.id = mi.movie_id\n\
        \  AND t.id = mk.movie_id\n  AND t.id = mc.movie_id\n  AND t.id = cc.movie_id\n\
        \  AND mk.movie_id = mi.movie_id\n  AND mk.movie_id = mc.movie_id\n  AND mk.movie_id\
        \ = cc.movie_id\n  AND mi.movie_id = mc.movie_id\n  AND mi.movie_id = cc.movie_id\n\
        \  AND mc.movie_id = cc.movie_id\n  AND k.id = mk.keyword_id\n  AND it1.id\
        \ = mi.info_type_id\n  AND cn.id = mc.company_id\n  AND ct.id = mc.company_type_id\n\
        \  AND cct1.id = cc.status_id;"
      c: "SELECT kt.kind AS movie_kind,\n       t.title AS complete_us_internet_movie\n\
        FROM complete_cast AS cc,\n     comp_cast_type AS cct1,\n     company_name\
        \ AS cn,\n     company_type AS ct,\n     info_type AS it1,\n     keyword AS\
        \ k,\n     kind_type AS kt,\n     movie_companies AS mc,\n     movie_info\
        \ AS mi,\n     movie_keyword AS mk,\n     title AS t\nWHERE cct1.kind = \"\
        complete+verified\"\n  AND cn.country_code = \"[us]\"\n  AND it1.info = \"\
        release dates\"\n  AND (kt.kind = \"movie\" OR kt.kind = \"tv movie\" OR kt.kind\
        \ = \"video movie\" OR kt.kind = \"video game\")\n  AND mi.note LIKE \"%internet%\"\
        \n  AND mi.info != \"\"\n  AND (mi.info LIKE \"USA:% 199%\"\n       OR mi.info\
        \ LIKE \"USA:% 200%\")\n  AND t.production_year > 1990\n  AND kt.id = t.kind_id\n\
        \  AND t.id = mi.movie_id\n  AND t.id = mk.movie_id\n  AND t.id = mc.movie_id\n\
        \  AND t.id = cc.movie_id\n  AND mk.movie_id = mi.movie_id\n  AND mk.movie_id\
        \ = mc.movie_id\n  AND mk.movie_id = cc.movie_id\n  AND mi.movie_id = mc.movie_id\n\
        \  AND mi.movie_id = cc.movie_id\n  AND mc.movie_id = cc.movie_id\n  AND k.id\
        \ = mk.keyword_id\n  AND it1.id = mi.info_type_id\n  AND cn.id = mc.company_id\n\
        \  AND ct.id = mc.company_type_id\n  AND cct1.id = cc.status_id;"
