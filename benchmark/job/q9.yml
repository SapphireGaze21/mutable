description: Join Order Benchmark Query 9
suite: job
benchmark: q9
readonly: true
data:
  aka_name:
    file: benchmark/job/data/aka_name.csv
    lines_in_file: 901343
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      name: CHAR 100
      imdb_index: CHAR 3
      name_pcode_cf: CHAR 11
      name_pcode_nf: CHAR 11
      surname_pcode: CHAR 11
      md5sum: CHAR 65
  char_name:
    file: benchmark/job/data/char_name.csv
    lines_in_file: 3140339
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      imdb_index: CHAR 2
      imdb_id: INT
      name_pcode_nf: CHAR 5
      surname_pcode: CHAR 5
      md5sum: CHAR 32
  cast_info:
    file: benchmark/job/data/cast_info.csv
    lines_in_file: 36244344
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      movie_id: INT NOT NULL
      person_role_id: INT
      note: CHAR 100
      nr_order: INT
      role_id: INT NOT NULL
  company_name:
    file: benchmark/job/data/company_name.csv
    lines_in_file: 234997
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      country_code: CHAR 6
      imdb_id: INT
      name_pcode_nf: CHAR 5
      name_pcode_sf: CHAR 5
      md5sum: CHAR 32
  movie_companies:
    file: benchmark/job/data/movie_companies.csv
    lines_in_file: 2609129
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      movie_id: INT NOT NULL
      company_id: INT NOT NULL
      company_type_id: INT NOT NULL
      note: CHAR 100
  name:
    file: benchmark/job/data/name.csv
    lines_in_file: 4167491
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      name: CHAR 100 NOT NULL
      imdb_index: CHAR 9
      imdb_id: INT
      gender: CHAR 1
      name_pcode_cf: CHAR 5
      name_pcode_nf: CHAR 5
      surname_pcode: CHAR 5
      md5sum: CHAR 32
  role_type:
    file: benchmark/job/data/role_type.csv
    lines_in_file: 12
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      role: CHAR 32 NOT NULL
  title:
    file: benchmark/job/data/title.csv
    lines_in_file: 2528312
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      title: CHAR 100 NOT NULL
      imdb_index: CHAR 5
      kind_id: INT NOT NULL
      production_year: INT
      imdb_id: INT
      phonetic_code: CHAR 5
      episode_of_id: INT
      season_nr: INT
      episode_nr: INT
      series_years: CHAR 49
      md5sum: CHAR 32
systems:
  mutable:
    configurations:
      WasmV8, PAX4M:
        args: --backend WasmV8 --data-layout PAX4M --plan-enumerator ... --plan --physplan
          --hash-table-initial-capacity 16384
        pattern: ^Execute machine code:.*
    cases:
      a: "SELECT an.name AS alternative_name,\n       chn.name AS character_name,\n\
        \       t.title AS movie\nFROM aka_name AS an,\n     char_name AS chn,\n \
        \    cast_info AS ci,\n     company_name AS cn,\n     movie_companies AS mc,\n\
        \     name AS n,\n     role_type AS rt,\n     title AS t\nWHERE (ci.note =\
        \ \"(voice)\" OR ci.note = \"(voice: Japanese version)\" OR ci.note = \"(voice)\
        \ (uncredited)\" OR ci.note = \"(voice: English version)\")\n  AND cn.country_code\
        \ = \"[us]\"\n  AND mc.note != \"\"\n  AND (mc.note LIKE \"%(USA)%\"\n   \
        \    OR mc.note LIKE \"%(worldwide)%\")\n  AND n.gender = \"f\"\n  AND n.name\
        \ LIKE \"%Ang%\"\n  AND rt.role = \"actress\"\n  AND (t.production_year >=\
        \ 2005 AND t.production_year <= 2015)\n  AND ci.movie_id = t.id\n  AND t.id\
        \ = mc.movie_id\n  AND ci.movie_id = mc.movie_id\n  AND mc.company_id = cn.id\n\
        \  AND ci.role_id = rt.id\n  AND n.id = ci.person_id\n  AND chn.id = ci.person_role_id\n\
        \  AND an.person_id = n.id\n  AND an.person_id = ci.person_id;"
      b: "SELECT an.name AS alternative_name,\n       chn.name AS voiced_character,\n\
        \       n.name AS voicing_actress,\n       t.title AS american_movie\nFROM\
        \ aka_name AS an,\n     char_name AS chn,\n     cast_info AS ci,\n     company_name\
        \ AS cn,\n     movie_companies AS mc,\n     name AS n,\n     role_type AS\
        \ rt,\n     title AS t\nWHERE ci.note = \"(voice)\"\n  AND cn.country_code\
        \ = \"[us]\"\n  AND mc.note LIKE \"%(200%)%\"\n  AND (mc.note LIKE \"%(USA)%\"\
        \n       OR mc.note LIKE \"%(worldwide)%\")\n  AND n.gender = \"f\"\n  AND\
        \ n.name LIKE \"%Angel%\"\n  AND rt.role = \"actress\"\n  AND (t.production_year\
        \ >= 2007 AND t.production_year <= 2010)\n  AND ci.movie_id = t.id\n  AND\
        \ t.id = mc.movie_id\n  AND ci.movie_id = mc.movie_id\n  AND mc.company_id\
        \ = cn.id\n  AND ci.role_id = rt.id\n  AND n.id = ci.person_id\n  AND chn.id\
        \ = ci.person_role_id\n  AND an.person_id = n.id\n  AND an.person_id = ci.person_id;"
      c: "SELECT an.name AS alternative_name,\n       chn.name AS voiced_character_name,\n\
        \       n.name AS voicing_actress,\n       t.title AS american_movie\nFROM\
        \ aka_name AS an,\n     char_name AS chn,\n     cast_info AS ci,\n     company_name\
        \ AS cn,\n     movie_companies AS mc,\n     name AS n,\n     role_type AS\
        \ rt,\n     title AS t\nWHERE (ci.note = \"(voice)\" OR ci.note = \"(voice:\
        \ Japanese version)\" OR ci.note = \"(voice) (uncredited)\" OR ci.note = \"\
        (voice: English version)\")\n  AND cn.country_code = \"[us]\"\n  AND n.gender\
        \ = \"f\"\n  AND n.name LIKE \"%An%\"\n  AND rt.role = \"actress\"\n  AND\
        \ ci.movie_id = t.id\n  AND t.id = mc.movie_id\n  AND ci.movie_id = mc.movie_id\n\
        \  AND mc.company_id = cn.id\n  AND ci.role_id = rt.id\n  AND n.id = ci.person_id\n\
        \  AND chn.id = ci.person_role_id\n  AND an.person_id = n.id\n  AND an.person_id\
        \ = ci.person_id;"
      d: "SELECT an.name AS alternative_name,\n       chn.name AS voiced_char_name,\n\
        \       n.name AS voicing_actress,\n       t.title AS american_movie\nFROM\
        \ aka_name AS an,\n     char_name AS chn,\n     cast_info AS ci,\n     company_name\
        \ AS cn,\n     movie_companies AS mc,\n     name AS n,\n     role_type AS\
        \ rt,\n     title AS t\nWHERE (ci.note = \"(voice)\" OR ci.note = \"(voice:\
        \ Japanese version)\" OR ci.note = \"(voice) (uncredited)\" OR ci.note = \"\
        (voice: English version)\")\n  AND cn.country_code = \"[us]\"\n  AND n.gender\
        \ = \"f\"\n  AND rt.role = \"actress\"\n  AND ci.movie_id = t.id\n  AND t.id\
        \ = mc.movie_id\n  AND ci.movie_id = mc.movie_id\n  AND mc.company_id = cn.id\n\
        \  AND ci.role_id = rt.id\n  AND n.id = ci.person_id\n  AND chn.id = ci.person_role_id\n\
        \  AND an.person_id = n.id\n  AND an.person_id = ci.person_id;"
