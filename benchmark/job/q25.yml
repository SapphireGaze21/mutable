description: Join Order Benchmark Query 25
suite: job
benchmark: q25
readonly: true
data:
  cast_info:
    file: benchmark/job/data/cast_info.csv
    lines_in_file: 36244344
    format: csv
    delimiter: ','
    header: 0
    attributes:
      id: INT NOT NULL PRIMARY KEY
      person_id: INT NOT NULL
      movie_id: INT NOT NULL
      person_role_id: INT
      note: CHAR 100
      nr_order: INT
      role_id: INT NOT NULL
